# Tax Graph - one-stop tuning. Copy to `tax-graph.config.yaml` (gitignored) and edit.
# This file is the single place to change behavior without touching code:
# prompts, model/provider, API keys, paths, rate limits, thresholds.
#
# Secret resolution order (per key): explicit value here  ->  OS keyring  ->  env var.
# Prefer keyring/env for real secrets; NEVER commit a real key.

project:
  tax_years: [2025]
  paths:
    graph_dir: graph
    schemas_dir: schemas
    raw_store: .cache/raw        # downloaded IRS docs (gitignored)
    build_dir: build             # compiled SQLite artifacts
    output_dir: output           # return records, traces (gitignored)
    manifest: config/manifest.yaml

llm:
  provider: anthropic
  model: claude-opus-4-8         # confirm current flagship at build time
  temperature: 0
  max_tokens: 8000
  api_key: null                  # leave null; prefer keyring/env below
  api_key_keyring: tax-graph/anthropic
  api_key_env: ANTHROPIC_API_KEY

extraction:
  auto_accept_confidence: 0.95   # >= this AND critic agrees -> draft auto-accepted (still PR-reviewed)
  require_critic_agreement: true # independent critic must agree, else flag for human
  max_docs_per_run: 5
  prompts:                       # tune these files; referenced here so it's one-stop
    generator: prompts/extract_generator.md
    critic: prompts/extract_critic.md
    citation_finder: prompts/citation_finder.md

ocr:                             # IRS-document rendering (build-time; public docs, no privacy issue)
  provider: mistral
  model: mistral-ocr-latest      # confirm current OCR model id at build time
  api_key: null                  # leave null; prefer keyring/env below
  api_key_keyring: tax-graph/mistral
  api_key_env: MISTRAL_API_KEY
  output: markdown               # store per-doc + per-page markdown and extracted hyperlinks
  cache_by_hash: true            # skip re-OCR of unchanged docs (paid API)

acquire:
  user_agent: "tax-graph-bot/0.1 (+https://github.com/JohnKruse/tax_graph)"
  rate_limit_per_sec: 1
  retries: 3
  timeout_sec: 30

oracles:                         # differential testing (M6)
  opentaxsolver_bin: null
  policyengine_enabled: false

logging:
  level: INFO
