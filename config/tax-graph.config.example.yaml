# Tax Graph - one-stop tuning. Copy to `config/tax-graph.config.yaml` (gitignored) and edit.
# This file is the single place to change behavior without touching code:
# prompts, model/provider, API keys, paths, rate limits, thresholds.
#
# Secret resolution order (per key): explicit value here  ->  OS keyring  ->  env var.
# Prefer keyring/env for real secrets; NEVER commit a real key.

project:
  tax_years: [2025]
  paths:
    graph_dir: graph
    graph_ext_dir: graph_ext     # user-gated local extension overlay; never shipped in SQLite
    schemas_dir: schemas
    raw_store: .cache/raw        # downloaded IRS docs (gitignored)
    build_dir: build             # compiled SQLite artifacts
    output_dir: output           # return-scoped artifacts under returns/<return_id> (gitignored)
    manifest: config/manifest.yaml

llm:
  provider: openrouter           # default: one key, any vendor's model via the OpenRouter gateway (https://openrouter.ai)
  model: null                    # pick an OpenRouter model id, e.g. anthropic/claude-opus-4, google/gemini-2.5-pro, openai/gpt-5.1
  vendor_family: null            # optional telemetry label for the primary model family, e.g. anthropic
  example_model: null            # optional dedicated model for IRS example mining; falls back to micro_model, then model
  nversion_model: null           # optional second-family model for verification, e.g. google/gemini-2.5-pro
  nversion_vendor_family: null   # required by process when nversion_model is used live, e.g. google
  base_url: https://openrouter.ai/api/v1
  site_url: null                 # optional OpenRouter HTTP-Referer header
  app_name: Tax Graph            # optional OpenRouter X-Title header
  require_parameters: auto       # auto retries once without the provider hint if the endpoint rejects it; use true/false to force
  reasoning_effort: null         # optional OpenRouter reasoning control for capable models, e.g. minimal
  reasoning_exclude: null        # optional: true keeps reasoning tokens out of responses when supported
  temperature: 0
  strict_schema: false           # extractor validates drafts after parsing; strict mode rejects optional graph fields
  max_tokens: 16000
  critic_max_tokens: 4000
  micro_model: null              # optional cheaper/faster model for outline-first micro-extractions
  micro_max_tokens: 8000
  api_key: null                  # leave null; prefer keyring/env below
  api_key_keyring: tax-graph/openrouter
  api_key_env: OPENROUTER_API_KEY

extraction:
  mode: one_pass                  # one_pass or outline_first; outline_first is the M4 Step 7 canary path
  # M8: routing is deterministic from check outcomes; confidence is telemetry only.
  calibration_sample_rate: 0.10  # share of clean objects a human audits cold (escapes -> drill catalog)
  calibration_min: 5             # minimum calibration sample size per form
  require_critic_agreement: true # independent critic must agree, else flag for human
  max_docs_per_run: 5
  prompts:                       # tune these files; referenced here so it's one-stop
    generator: prompts/extract_generator.md
    critic: prompts/extract_critic.md
    citation_finder: prompts/citation_finder.md

ocr:                             # IRS-document rendering (build-time; public docs, no privacy issue)
  provider: mistral
  model: mistral-ocr-latest      # confirm current OCR model id at build time
  api_key: null                  # leave null; prefer keyring/env below
  api_key_keyring: tax-graph/mistral
  api_key_env: MISTRAL_API_KEY
  output: markdown               # store per-doc + per-page markdown and extracted hyperlinks
  cache_by_hash: true            # skip re-OCR of unchanged docs (paid API)

intake:
  classifier_provider: local_rules # local_rules is keyless; remote providers require consent
  consent: null                    # set to always only if the user explicitly chooses standing consent

acquire:
  user_agent: "tax-graph-bot/0.1 (+https://github.com/JohnKruse/tax_graph)"
  rate_limit_per_sec: 1
  retries: 3
  timeout_sec: 30

oracles:                         # differential testing (M6)
  opentaxsolver:
    version: "2025_23.06"        # pin the SourceForge release used for live oracle jobs
    install_dir: .cache/oracles/opentaxsolver/2025_23.06
    executable: null             # optional override after install
    releases:
      windows:
        url: https://sourceforge.net/projects/opentaxsolver/files/OTS_2025/v23.06_mswin/OpenTaxSolver2025_23.06_mswin.zip/download
        sha256: 7d570384801b04a70eea4e704f80f2c5f37472ecd3406e9a3d695d132b963bc7
      linux:
        url: null                # set to the pinned SourceForge .tgz download URL
        sha256: null
      macos:
        url: null                # set to the pinned SourceForge .tgz download URL
        sha256: null

logging:
  level: INFO
