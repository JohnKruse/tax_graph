# Core reusable rules for the capital-gains slice.
# Operations are from the v0 primitive set (schemas/rule.schema.json).

- rule_id: copy_currency_value
  operation: COPY
  description: Copy a currency value from the source node to the target node.
  rounding: none

- rule_id: sum_currency
  operation: SUM
  description: >-
    Sum the currency values of all edges that target a node with this rule
    (each edge role 'addend'). Blank operands count as zero.
  parameters:
    include_blank_as_zero: true
  rounding: currency

- rule_id: subtract_currency
  operation: SUBTRACT
  description: >-
    Subtract the 'subtrahend' operand edge from the 'minuend' operand edge.
  rounding: currency

- rule_id: lookup_capital_loss_limit
  operation: LOOKUP_TABLE
  description: Select the Schedule D capital loss limit by filing status.
  rounding: currency
  citation_refs:
    - cite_schedule_d_line21_loss_limit

- rule_id: negate_currency
  operation: NEGATE
  description: Convert a positive currency amount to the matching negative amount.
  rounding: currency

- rule_id: max_currency
  operation: MAX
  description: Select the larger currency value from the candidate operands.
  rounding: currency

- rule_id: min_currency
  operation: MIN
  description: Select the smaller currency value from the candidate operands.
  rounding: currency

- rule_id: min_dollar
  operation: MIN
  description: Select the smaller tax amount and round to whole dollars.
  rounding: dollar

- rule_id: lookup_selected_value
  operation: LOOKUP_TABLE
  description: Select the operand whose role matches the supplied key operand.
  rounding: none

- rule_id: lookup_selected_value_required
  operation: LOOKUP_TABLE
  description: Select the operand whose role matches the supplied key operand.
  parameters:
    selected_blank_is_missing: true
  rounding: none

- rule_id: lookup_tax_table_amount
  operation: LOOKUP_TABLE
  description: Look up the tax-table value for an income band and filing status.
  parameters:
    resource: tax_table
  rounding: dollar
  citation_refs:
    - cite_1040_tax_table

- rule_id: lookup_bracket_tax
  operation: LOOKUP_BRACKET
  description: >-
    Compute tax from the selected bracket table and taxable amount. Cents are
    carried (the Tax Computation Worksheet subtraction amounts end in .25/.50,
    so the exact result is fractional); whole-dollar rounding happens ONCE at
    the final line 16 entry, matching the worksheet's own entry discipline.
  rounding: currency

- rule_id: multiply_currency
  operation: MULTIPLY
  description: Multiply the supplied currency amount by a cited rate parameter.
  rounding: currency

- rule_id: if_less_than_currency
  operation: IF_ELSE
  description: Choose between two values when the condition amount is below the threshold.
  parameters:
    comparison: lt
  rounding: none

- rule_id: if_greater_than_currency
  operation: IF_ELSE
  description: Choose between two values when the condition amount is above the threshold.
  parameters:
    comparison: gt
  rounding: none
