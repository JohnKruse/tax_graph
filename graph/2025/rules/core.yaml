# Core reusable rules for the capital-gains slice.
# Operations are from the v0 primitive set (schemas/rule.schema.json).

- rule_id: copy_currency_value
  operation: COPY
  description: Copy a currency value from the source node to the target node.
  rounding: none

- rule_id: sum_currency
  operation: SUM
  description: >-
    Sum the currency values of all edges that target a node with this rule
    (each edge role 'addend'). Blank operands count as zero.
  parameters:
    include_blank_as_zero: true
  rounding: currency

- rule_id: subtract_currency
  operation: SUBTRACT
  description: >-
    Subtract the 'subtrahend' operand edge from the 'minuend' operand edge.
  rounding: currency

- rule_id: lookup_capital_loss_limit
  operation: LOOKUP_TABLE
  description: Select the Schedule D capital loss limit by filing status.
  rounding: currency
  citation_refs:
    - cite_schedule_d_line21_loss_limit

- rule_id: negate_currency
  operation: NEGATE
  description: Convert a positive currency amount to the matching negative amount.
  rounding: currency

- rule_id: max_currency
  operation: MAX
  description: Select the larger currency value from the candidate operands.
  rounding: currency
