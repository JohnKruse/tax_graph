# --- Schedule D lines 17-20: routing to the QDCGT or Schedule D Tax Worksheet ---
# Line 17 asks "Are lines 15 and 16 both gains?" - MIN(15,16) > 0 is that test.
# Line 20 asks "Are lines 18 and 19 both zero or blank?" - MAX(18,19) > 0 means No.
# sdtw_applies = MIN(gate17, gate20) is positive exactly when both are Yes/No
# respectively, i.e. when the Schedule D Tax Worksheet computes the line 16 tax.
# Form 4952 is not modeled (out of the supported profile), so the line 20 text's
# "and you are not filing Form 4952" holds by scope.
- node_id: schedule_d_2025_line_17_gate
  document_id: schedule_d_2025
  label: Schedule D line 17 - smaller of line 15 or line 16 (positive when both gains)
  node_type: computed
  value_type: currency
  required: optional
  citation_refs:
    - cite_schedule_d_line17_both_gains

- node_id: schedule_d_2025_line_18
  document_id: schedule_d_2025
