    1. Did you, and your spouse if filing a joint return, have either an SSN or ITIN issued on or before the due date of your
    2025 return (including extensions)? (Answer "Yes" if you are applying for an ITIN on or before the return due date (including
    extensions).) [ ] Yes. [ ] No. You can''t claim the credit for other dependents. 2. Did your qualifying relative have
    an SSN, ITIN, or ATIN issued on or before the due date of your 2025 return (including extensions)? (Answer "Yes" if you
    are applying for an ITIN or ATIN for the qualifying relative on or before the return due date (including extensions).)
    [ ] Yes. [ ] No. You can''t claim the credit for other dependents for this qualifying relative. 3. Was your qualifying
    relative a U.S. citizen, U.S. national, or U.S. resident alien? (See Pub. 519 for the definition of a U.S. national or
    a U.S. resident alien. If your qualifying relative was adopted, see Exception to citizen test, later.) [ ] Yes. You can
    claim the credit for other dependents for this dependent. Check the "Credit for other dependents" box on row (7) of the
    Dependents section on page 1 of Form 1040 or 1040-SR for this person. [ ] No. You can''t claim the credit for other dependents
    for this qualifying relative. Definitions and Special Rules Adopted child. An adopted child is always treated as your
    own child. An adopted child includes a child lawfully placed with you for legal adoption. Adoption taxpayer identification
    numbers (ATINs). If you have a dependent who was placed with you for legal adoption and you don''t know the dependent''s
    SSN, you must get an ATIN for the dependent from the IRS. See Form W-7A for details. If the dependent isn''t a U.S. citizen
    or resident alien, apply for an ITIN instead using Form W-7. Children of divorced or separated parents. A child will be
    treated as the qualifying child or qualifying relative of the child''s noncustodial parent (defined later) if all of the
    following conditions apply. The parents are divorced, legally separated, separated under a written separation agreement,
    or lived apart at all times during the last 6 months of 2025 (whether or not they are or were married). The child received
    over half of the child''s support for 2025 from the parents (and the rules on Multiple support agreements, later, don''t
    apply). Support of a child received from a parent''s spouse is treated as provided by the parent. The child is in custody
    of one or both of the parents for more than half of 2025. Either of the following applies. The custodial parent signs
    Form 8332 or a substantially similar statement that they won''t claim the child as a dependent for 2025, and the noncustodial
    parent includes a copy of the form or statement with their return. If the divorce decree or separation agreement went
    into effect after 1984 and before 2009, the noncustodial parent may be able to include certain pages from the decree or
    agreement instead of Form 8332. See Post-1984 and pre-2009 decree or agreement and Post-2008 decree or agreement. A pre-1985
    decree of divorce or separate maintenance or written separation agreement between the parents provides that the noncustodial
    parent can claim the child as a dependent, and the noncustodial parent provides at least $600 for support of the child
    during 2025. If conditions (1) through (4) apply, only the noncustodial parent can claim the child for purposes of the
    child tax credit and credit for other dependents (lines 19 and 28). However, this doesn''t allow the noncustodial parent
    to claim head of household filing status, the credit for child and dependent care expenses, the exclusion for dependent
    care benefits, or the earned income credit. The custodial parent or another taxpayer, if eligible, can claim the child
    for the earned income credit and these other benefits. See Pub. 501 for details. Custodial and noncustodial parents. The
    custodial parent is the parent with whom the child lived for the greater number of nights in 2025. The noncustodial parent
    is the other parent. If the child was with each parent for an equal number of nights, the custodial parent is the parent
    with the higher adjusted gross income. See Pub. 501 for an exception for a parent who works at night, rules for a child
    who is emancipated under state law, and other details. Post-1984 and pre-2009 decree or agreement. The decree or agreement
    must state all three of the following. The noncustodial parent can claim the child as a dependent without regard to any
    condition, such as payment of support. The other parent won''t claim the child as a dependent. The years for which the
    claim is released. The noncustodial parent must include all of the following pages from the decree or agreement. Cover
    page (include the other parent''s SSN on that page). The pages that include all the information identified in (1) through
    (3) above. Signature page with the other parent''s signature and date of agreement. You must include the required information
    even if you filed it with your return in an earlier year. Post-2008 decree or agreement. If the divorce decree or separation
    agreement went into effect after 2008, the noncustodial parent can''t include pages from the decree or agreement instead
    of Form 8332. The custodial parent must sign either Form 8332 or a substantially similar statement the only purpose of
    which is to release the custodial parent''s claim to certain tax benefits for a child, and the noncustodial parent must
    include a copy with their return. The form or statement must release the custodial parent''s claim to the child without
    any conditions. For example, the release must not depend on the noncustodial parent paying support. Release of certain
    tax benefits revoked. A custodial parent who has revoked their previous release of a claim to certain tax benefits for
    a child must include a copy of the revocation with their return. For details, see Form 8332. Exception to citizen test.
    If you are a U.S. citizen or U.S. national and your adopted child lived with you all year as a member of your household,
    that child meets the requirement to be a U.S. citizen in Step 2, question 1; Step 3, question 2; Step 4, question 2; and
    Step 5, question 3. Exception to gross income test. If your relative (including a person who lived with you all year as
    a member of your household) is permanently and totally disabled (defined later), certain income for services performed
    at a sheltered workshop may be excluded for this test. For details, see Pub. 501. Exception to time lived with you. Temporary
    absences by you or the other person for special circumstances, such as school, vacation, business, medical care, military
    service, or detention in a juvenile facility, count as time the person lived with you. Also see Children of divorced or
    separated parents, earlier, or Kidnapped child, later. If the person meets all other requirements to be your qualifying
    child but was born or died in 2025, the person is considered to have lived with you for more than half of 2025 if your
    home was this person''s home for more than half the time the person was alive in 2025. If the person meets all other requirements
    to be your qualifying child but you adopted the person in 2025, the person was lawfully placed with you for legal adoption
    by you in 2025, or if the person was an eligible foster child placed with you during 2025, the person is considered to
    have lived with you for more than half of 2025 if your main home was this person''s main home for more than half the time
    since the person was adopted or placed with you in 2025. Any other person is considered to have lived with you for all
    of 2025 if the person was born or died in 2025 and your home was this person''s home for the entire time the person was
    alive in 2025, or if you adopted the person in 2025, the person was lawfully placed with you for legal adoption by you
    in 2025, or the person was an eligible foster child placed with you during 2025 and your main home was the person''s main
    home for the entire time since the person was adopted or placed with you in 2025. Foster child. A foster child is any
    child placed with you by an authorized placement agency or by judgment, decree, or other order of any court of competent
    jurisdiction. Full-time student. A full-time student is a child who during any part of 5 calendar months of 2025 was enrolled
    as a full-time student at a school or took a full-time, on-farm training course given by a school or a state, county,
    or local government agency. A school includes a technical, trade, or mechanical school. It doesn''t include an on-the-job
    training course, correspondence school, or school offering courses only through the Internet. Kidnapped child. If your
    child is presumed by law enforcement authorities to have been kidnapped by someone who isn''t a family member, you may
    be able to take the child into account in determining your eligibility for head of household or qualifying surviving spouse
    filing status, the child tax credit, the credit for other dependents, and the earned income credit (EIC). For details,
    see Pub. 501 (Pub. 596 for the EIC). Married person. If the person is married and files a joint return, you can''t claim
    that person as your dependent. However, if the person is married but doesn''t file a joint return or files a joint return
    only to claim a refund of withheld income tax or estimated tax paid, you may be able to claim that person as a dependent.
    (See Pub. 501 for details and examples.) In that case, go to Step 2, question 3 (for a qualifying child), or Step 4, question
    4 (for a qualifying relative). Multiple support agreements. If no one person contributed over half of the support of your
    relative (or a person who lived with you all year as a member of your household) but you and another person(s) provided
    more than half of your relative''s support, special rules may apply that would treat you as having provided over half
    of the support. For details, see Pub. 501. Permanently and totally disabled. A person is permanently and totally disabled
    if, at any time in 2025, the person can''t engage in any substantial gainful activity because of a physical or mental
    condition and a doctor has determined that this condition has lasted or can be expected to last continuously for at least
    a year or can be expected to lead to death. Public assistance payments. If you received payments under the Temporary Assistance
    for Needy Families (TANF) program or other public assistance program and you used the money to support another person,
    see Pub. 501. Qualifying child of more than one person. Even if a child meets the conditions to be the qualifying child
    of more than one person, only one person can claim the child as a qualifying child for all of the following tax benefits,
    unless the special rule for Children of divorced or separated parents, described earlier, applies. Child tax credit and
    credit for other dependents (line 19) and additional child tax credit (line 28). Head of household filing status. Credit
    for child and dependent care expenses (Schedule 3, line 2). Exclusion for dependent care benefits (Form 2441, Part III).
    Earned income credit (line 27a). No other person can take any of the five tax benefits just listed based on the qualifying
    child. If you and any other person can claim the child as a qualifying child, the following rules apply. For purposes
    of these rules, the term "parent" means a biological or adoptive parent of an individual. It doesn''t include a stepparent
    or foster parent unless that person has adopted the individual. If only one of the persons is the child''s parent, the
    child is treated as the qualifying child of the parent. If the parents file a joint return together and can claim the
    child as a qualifying child, the child is treated as the qualifying child of the parents. If the parents don''t file a
    joint return together but both parents claim the child as a qualifying child, the IRS will treat the child as the qualifying
    child of the parent with whom the child lived for the longer period of time in 2025. If the child lived with each parent
    for the same amount of time, the IRS will treat the child as the qualifying child of the parent who had the higher adjusted
    gross income (AGI) for 2025. If no parent can claim the child as a qualifying child, the child is treated as the qualifying
    child of the person who had the highest AGI for 2025. If a parent can claim the child as a qualifying child but no parent
    does so claim the child, the child is treated as the qualifying child of the person who had the highest AGI for 2025,
    but only if that person''s AGI is higher than the highest AGI of any parent of the child who can claim the child. Example.
    Your child meets the conditions to be a qualifying child for both you and your parent. Your child doesn''t meet the conditions
    to be a qualifying child of any other person, including your child''s other parent. Under the rules just described, you
    can claim your child as a qualifying child for all of the five tax benefits just listed for which you otherwise qualify.
    Your parent can''t claim any of those five tax benefits based on your child. However, if your parent''s AGI is higher
    than yours and you do not claim your child as a qualifying child, your child is the qualifying child of your parent. For
    more details and examples, see Pub. 501. If you will be claiming the child as a qualifying child, go to Step 2. Otherwise,
    stop; you can''t claim any benefits based on this child. Social security number. You must enter each dependent''s social
    security number (SSN). Be sure the name and SSN entered agree with the dependent''s social security card. Otherwise, at
    the time we process your return, we may reduce or disallow any tax benefits (such as the child tax credit) based on that
    dependent. If the name or SSN on the dependent''s social security card isn''t correct or you need to get an SSN for your
    dependent, contact the Social Security Administration (SSA). See Social Security Number (SSN), earlier. If your dependent
    won''t have a number by the date your return is due, see What if You Can''t File on Time? earlier. For the child tax credit,
    your child must have a valid SSN. A valid SSN is one that is valid for employment and that is issued by the SSA before
    the due date of your 2025 return (including extensions). If your child was a U.S. citizen when the child received the
    SSN, the SSN is valid for employment. If "Not Valid for Employment" is printed on your child''s social security card and
    your child''s immigration status has changed so that your child is now a U.S. citizen or permanent resident, ask the SSA
    for a new social security card without the legend. However, if "Valid for Work Only With DHS Authorization" is printed
    on your child''s social security card, your child has the required SSN only as long as the DHS authorization is valid.
    If your dependent child was born and died in 2025 and you do not have an SSN for the child, enter "Died" on row (3) of
    the Dependents section and include a copy of the child''s birth certificate, death certificate, or hospital records. The
    document must show the child was born alive. If you didn''t have an SSN that is valid for employment and issued before
    the due date of your 2025 return (including extensions), you can''t claim the child tax credit on your original or amended
    2025 return. To claim the credit on a joint return, you or your spouse must have an SSN that is valid for employment and
    issued before the due date of your 2025 return (including extensions). The other spouse must have either an SSN or ITIN,
    and it must have been issued on or before the due date of the return (including extensions). If you, or your spouse if
    filing jointly, didn''t have either an SSN or ITIN issued on or before the due date of your 2025 return (including extensions),
    you can''t claim the credit for other dependents on your original or amended return. If you apply for an ITIN on or before
    the due date of your 2025 return (including extensions) and the IRS issues you an ITIN as a result of the application,
    the IRS will consider your ITIN as issued on or before the due date of your return. Income Generally, you must report
    all income except income that is exempt from tax by law. For details, see the following instructions and the Schedule
    1 instructions, especially the instructions for lines 1 through 7 and Schedule 1, lines 1 through 8z. Also see Pub. 525.
    Forgiveness of Paycheck Protection Program (PPP) Loans You don''t need to include the amount of a forgiven PPP Loan in
    your income. Although you don''t need to report the income from the forgiveness of your PPP Loan on Form 1040 or 1040-SR,
    you do need to report certain information related to your PPP Loan as an attachment to your tax return. For more information,
    see Pub. 525. Foreign-Source Income You must report unearned income, such as interest, dividends, and pensions, from sources
    outside the United States unless exempt by law or a tax treaty. You must also report earned income, such as wages and
    tips, from sources outside the United States. If you worked abroad, you may be able to exclude part or all of your foreign
    earned income. For details, see Pub. 54 and Form 2555. Foreign retirement plans. If you were a beneficiary of a foreign
    retirement plan, you may have to report the undistributed income earned in your plan. However, if you were the beneficiary
    of a Canadian registered retirement plan, see Rev. Proc. 2014-55, 2014-44 I.R.B. 753, available at IRS.gov/irb/2014-44_IRB#RP-2014-55,
    to find out if you can elect to defer tax on the undistributed income. Report distributions from foreign pension plans
    on lines 5a and 5b. Foreign accounts and trusts. You must complete Part III of Schedule B if you: Had a foreign account;
    or Received a distribution from, or were a grantor of, or a transferor to, a foreign trust. You may also have to file
    Form 3520. Foreign financial assets. If you had foreign financial assets in 2025, you may have to file Form 8938. See
    Form 8938 and its instructions. Chapter 11 Bankruptcy Cases If you are a debtor in a chapter 11 bankruptcy case, income
    taxable to the bankruptcy estate and reported on the estate''s income tax return includes: Earnings from services you
    performed after the beginning of the case (both wages and self-employment income); and Income from property described
    in section 541 of title 11 of the U.S. Code that you either owned when the case began or that you acquired after the case
    began and before the case was closed, dismissed, or converted to a case under a different chapter. Because this income
    is taxable to the estate, don''t include this income on your own individual income tax return. The only exception is for
    purposes of figuring your self-employment tax. For that purpose, you must take into account all your self-employment income
    for the year from services performed both before and after the beginning of the case. Also, you (or the trustee if one
    is appointed) must allocate between you and the bankruptcy estate the wages, salary, or other compensation and withheld
    income tax reported to you on Form W-2. A similar allocation is required for income and withheld income tax reported to
    you on Forms 1099. You must also include a statement that indicates you filed a chapter 11 case and that explains how
    income and withheld income tax reported to you on Forms W-2 and 1099 are allocated between you and the estate. For more
    details, including acceptable allocation methods, see Notice 2006-83, 2006-40 I.R.B. 596, available at IRS.gov/irb/2006-40_IRB#NOT-2006-83.
    Community Property States Community property states include Arizona, California, Idaho, Louisiana, Nevada, New Mexico,
    Texas, Washington, and Wisconsin. If you and your spouse lived in a community property state, you must usually follow
    state law to determine what is community income and what is separate income. For details, see Form 8958 and Pub. 555.
    Nevada, Washington, and California domestic partners. A registered domestic partner in Nevada, Washington, or California
    must generally report half the combined community income of the individual and their domestic partner. See Form 8958 and
    Pub. 555. Rounding Off to Whole Dollars You can round off cents to whole dollars on your return and schedules. If you
    do round to whole dollars, you must round all amounts. To round, drop amounts under 50 cents and increase amounts from
    50 to 99 cents to the next dollar. For example, $1.39 becomes $1 and $2.50 becomes $3. If you have to add two or more
    amounts to figure the amount to enter on a line, include cents when adding the amounts and round off only the total. If
    you are entering amounts that include cents, make sure to include the decimal point. There is no cents column on the form.
    The lines on Forms 1040 and 1040-SR are the same. References to lines in the following instructions refer to the line
    on either form. Line 1a Total Amount From Form(s) W-2, Box 1 Enter the total amount from Form(s) W-2, box 1. If a joint
    return, also include your spouse''s income from Form(s) W-2, box 1. If you earned wages while you were an inmate in a
    penal institution, report these amounts on Schedule 1, line 8u. Do not report these wages on line 1a. See the instructions
    for Schedule 1, line 8u. If you received a pension or annuity from a nonqualified deferred compensation plan or a nongovernmental
    section 457 plan and it was reported in box 1 of Form W-2, do not include this amount on Form 1040, line 1a. This amount
    is reported on Schedule 1, line 8t. Line 1b Household Employee Wages Not Reported on Form(s) W-2 Enter the total of your
    wages received as a household employee that was not reported on Form(s) W-2. An employer isn''t required to provide a
    Form W-2 to you if they paid you wages of less than $2,800 in 2025. For information on employment taxes for household
    employees, see Tax Topic 756. Line 1c Tip Income Not Reported on Line 1a Enter the total of your tip income that was not
    reported on Form 1040, line 1a. This should include any tip income you didn''t report to your employer and any allocated
    tips shown in box 8 on your Form(s) W-2 unless you can prove that your unreported tips are less than the amount in box
    8. Allocated tips aren''t included as income in box 1. See Pub. 531 for more details. Also, include the value of any noncash
    tips you received, such as tickets, passes, or other items of value. Although you don''t report these noncash tips to
    your employer, you must report them on line 1c. You may owe social security and Medicare or railroad retirement (RRTA)
    tax on unreported tips. See the instructions for Schedule 2, line 5. Line 1d Medicaid Waiver Payments Not Reported on
    Form(s) W-2, Box 1 Enter your taxable Medicaid waiver payments that were not reported on Form(s) W-2. Also enter the total
    of your taxable and nontaxable Medicaid waiver payments that were not reported on Form(s) W-2, or not reported in box
    1 of Form(s) W-2, if you choose to include nontaxable payments in earned income for purposes of claiming a credit or other
    tax benefit. If you and your spouse both received nontaxable Medicaid waiver payments during the year, you and your spouse
    can make different choices about including payments in earned income. See the instructions for Schedule 1, line 8s. If
    you are a sole proprietor in a business of providing home care services, see the Schedule C instructions for how to report
    these amounts. If you do not have a separate trade or business of providing these services, enter on Form 1040, line 1d,
    your Medicaid waiver payments reported on Form 1099-MISC or Form 1099-NEC. Also, enter your nontaxable Medicaid waiver
    payments on Schedule 1, line 8s. Your nontaxable Medicaid waiver payments may have been reported to you on Form(s) W-2,
    box 12, with Code II. If you received nontaxable Medicaid waiver payments, and box 1 of your Form(s) W-2 is blank or has
    zeros, and you are choosing not to include nontaxable payments in earned income for purposes of claiming a credit, do
    not attach any of these Form(s) W-2 to your return. Line 1e Taxable Dependent Care Benefits From Form 2441, Line 26 Enter
    the total of your taxable dependent care benefits from Form 2441, line 26. Dependent care benefits should be shown in
    box 10 of your Form(s) W-2. But first complete Form 2441 to see if you can exclude part or all of the benefits. Line 1f
    Employer-Provided Adoption Benefits From Form 8839, Line 31 Enter the total of your employer-provided adoption benefits
    from Form 8839, line 31. Employer-provided adoption benefits should be shown in box 12 of your Form(s) W-2 with code T.
    But see the Instructions for Form 8839 to find out if you can exclude part or all of the benefits. You may also be able
    to exclude amounts if you adopted a child with special needs and the adoption became final in 2025. Line 1g Wages From
    Form 8919, Line 6 Enter the total of your wages from Form 8919, line 6. Line 1h Other Earned Income If you received scholarship
    or fellowship grants that were not reported to you on Form W-2, report these amounts on Schedule 1, line 8r. See the instructions
    for Schedule 1, line 8r. The following types of income must be included in the total on line 1h. Strike or lockout benefits
    (other than bona fide gifts). Excess elective deferrals. The amount deferred should be shown in box 12 of your Form W-2,
    and the "Retirement plan" box in box 13 should be checked. If the total amount you (or your spouse if filing jointly)
    deferred for 2025 under all plans was more than $23,500 (excluding catch-up contributions, as explained later), include
    the excess on line 1h. This limit is generally (a) $16,500 if you have only SIMPLE plans, and (b) $26,500 for section
    403(b) plans if you qualify for the 15-year rule in Pub. 571. Although designated Roth contributions are subject to this
    limit, don''t include the excess attributable to such contributions on line 1h. They are already included as income in
    box 1 of your Form W-2. A higher limit of $17,600 may apply to participants in certain SIMPLE plans. A higher limit may
    also apply to participants in section 457(b) deferred compensation plans for the 3 years before retirement age. Contact
    your plan administrator for more information. If you were age 50 or older at the end of 2025, your employer may have allowed
    an additional deferral (catch-up contributions) of up to $7,500 (generally, $3,500 for section 401(k)(11) and SIMPLE plans).
    If you were age 60 to 63 at the end of 2025, your employer may have allowed a catch-up contribution of up to $11,250 ($5,250
    for section 401(k)(11) and SIMPLE plans). This additional deferral amount isn''t subject to the overall limit on elective
    deferrals. A catch-up contribution limit of $3,850 may apply to certain participants in certain SIMPLE plans. Contact
    your plan administrator for more information. You can''t deduct the amount deferred. It isn''t included as income in box
    1 of your Form W-2. Disability pensions shown on Form 1099-R if you haven''t reached the minimum retirement age set by
    your employer. But see Insurance Premiums for Retired Public Safety Officers in the instructions for lines 5a and 5b.
    Disability pensions received after you reach minimum retirement age and other payments shown on Form 1099-R (other than
    payments from an IRA) are reported on lines 5a and 5b. Payments from an IRA are reported on lines 4a and 4b. Corrective
    distributions from a retirement plan shown on Form 1099-R of excess elective deferrals and excess contributions (plus
    earnings). But don''t include distributions from an IRA on line 1h. Instead, report distributions from an IRA on lines
    4a and 4b. Line 1i Nontaxable Combat Pay Election If you elect to include your nontaxable combat pay in your earned income
    when figuring the EIC, enter the amount on line 1i. See the instructions for line 27a. Were You a Statutory Employee?
    If you were a statutory employee, the "Statutory employee" box in box 13 of your Form W-2 should be checked. Statutory
    employees include full-time life insurance salespeople and certain agent or commission drivers, certain traveling salespeople,
    and certain homeworkers. Statutory employees report the amount shown in box 1 of Form W-2 on a Schedule C along with any
    related business expenses. Missing or Incorrect Form W-2? Your employer is required to provide or send Form W-2 to you
    no later than February 2, 2026. If you don''t receive it by early February, use Tax Topic 154 to find out what to do.
    Even if you don''t get a Form W-2, you must still report your earnings. If you lose your Form W-2 or it is incorrect,
    ask your employer for a new one. Line 2a Tax-Exempt Interest If you received any tax-exempt interest (including any tax-exempt
    original issue discount (OID)), such as from municipal bonds, each payer should send you a Form 1099-INT or a Form 1099-OID.
    In general, your tax-exempt stated interest should be shown in box 8 of Form 1099-INT or, for a tax-exempt OID bond, in
    box 2 of Form 1099-OID, and your tax-exempt OID should be shown in box 11 of Form 1099-OID. Enter the total on line 2a.
    However, if you acquired a tax-exempt bond at a premium, only report the net amount of tax-exempt interest on line 2a
    (that is, the excess of the tax-exempt interest received during the year over the amortized bond premium for the year).
    Also, if you acquired a tax-exempt OID bond at an acquisition premium, only report the net amount of tax-exempt OID on
    line 2a (that is, the excess of tax-exempt OID for the year over the amortized acquisition premium for the year). See
    Pub. 550 for more information about OID, bond premium, and acquisition premium. Also include on line 2a any exempt-interest
    dividends from a mutual fund or other regulated investment company. This amount should be shown in box 12 of Form 1099-DIV.
    Don''t include interest earned on your IRA, health savings account, Archer or Medicare Advantage MSA, or Coverdell education
    savings account. Don''t include any amounts related to the forgiveness of PPP Loans on this line. Line 2b Taxable Interest
    Each payer should send you a Form 1099-INT or Form 1099-OID. Enter your total taxable interest income on line 2b. But
    you must fill in and attach Schedule B if the total is over $1,500 or any of the other conditions listed at the beginning
    of the Schedule B instructions applies to you. For more details about reporting taxable interest, including original issue
    discount or market discount on debt instruments and adjustments for amortizable bond premium or acquisition premium, see
    Pub. 550. Interest credited in 2025 on deposits that you couldn''t withdraw because of the bankruptcy or insolvency of
    the financial institution may not have to be included in your 2025 income. For details, see Pub. 550. If you get a 2025
    Form 1099-INT for U.S. savings bond interest that includes amounts you reported before 2025, see Pub. 550. Line 3a Qualified
    Dividends Enter your total qualified dividends on line 3a. Qualified dividends are also included in the ordinary dividend
    total required to be shown on line 3b. Qualified dividends are eligible for a lower tax rate than other ordinary income.
    Generally, these dividends are shown in box 1b of Form(s) 1099-DIV. If you are including your child''s qualified dividends
    in the total on line 3a, check box 1 on line 3c. For more information, see the Instructions for Form 8814. See Pub. 550
    for the definition of qualified dividends if you received dividends not reported on Form 1099-DIV. Exception. Some dividends
    may be reported as qualified dividends in box 1b of Form 1099-DIV but aren''t qualified dividends. These include the following.
    Dividends you received as a nominee. See the Schedule B instructions. Dividends you received on any share of stock that
    you held for less than 61 days during the 121-day period that began 60 days before the ex-dividend date. The ex-dividend
    date is the first date following the declaration of a dividend on which the purchaser of a stock isn''t entitled to receive
    the next dividend payment. When counting the number of days you held the stock, include the day you disposed of the stock
    but not the day you acquired it. See the examples that follow. Also, when counting the number of days you held the stock,
    you can''t count certain days during which your risk of loss was diminished. See Pub. 550 for more details. Dividends
    attributable to periods totaling more than 366 days that you received on any share of preferred stock held for less than
    91 days during the 181-day period that began 90 days before the ex-dividend date. When counting the number of days you
    held the stock, you can''t count certain days during which your risk of loss was diminished. See Pub. 550 for more details.
    Preferred dividends attributable to periods totaling less than 367 days are subject to the 61-day holding period rule
    just described. Dividends on any share of stock to the extent that you are under an obligation (including a short sale)
    to make related payments with respect to positions in substantially similar or related property. Payments in lieu of dividends,
    but only if you know or have reason to know that the payments aren''t qualified dividends. Dividends from a corporation
    that first became a surrogate foreign corporation after December 22, 2017, other than a foreign corporation that is treated
    as a domestic corporation under section 7874(b). Example 1. You bought 5,000 shares of XYZ Corp. common stock on July
    8. XYZ Corp. paid a cash dividend of 10 cents per share. The ex-dividend date was July 16. Your Form 1099-DIV from XYZ
    Corp. shows $500 in box 1a (ordinary dividends) and in box 1b (qualified dividends). However, you sold the 5,000 shares
    on August 11. You held your shares of XYZ Corp. for only 34 days of the 121-day period (from July 9 through August 11).
    The 121-day period began on May 17 (60 days before the ex-dividend date) and ended on September 14. You have no qualified
    dividends from XYZ Corp. because you held the XYZ stock for less than 61 days. Example 2. The facts are the same as in
    Example 1 except that you bought the stock on July 15 (the day before the ex-dividend date), and you sold the stock on
    September 16. You held the stock for 63 days (from July 16 through September 16). The $500 of qualified dividends shown
    in box 1b of Form 1099-DIV are all qualified dividends because you held the stock for 61 days of the 121-day period (from
    July 16 through September 14). Example 3. You bought 10,000 shares of ABC Mutual Fund common stock on July 8. ABC Mutual
    Fund paid a cash dividend of 10 cents a share. The ex-dividend date was July 16. The ABC Mutual Fund advises you that
    the part of the dividend eligible to be treated as qualified dividends equals 2 cents a share. Your Form 1099-DIV from
    ABC Mutual Fund shows total ordinary dividends of $1,000 and qualified dividends of $200. However, you sold the 10,000
    shares on August 11. You have no qualified dividends from ABC Mutual Fund because you held the ABC Mutual Fund stock for
    less than 61 days. Use the Qualified Dividends and Capital Gain Tax Worksheet or the Schedule D Tax Worksheet, whichever
    applies, to figure your tax. See the instructions for line 16 for details. Line 3b Ordinary Dividends Each payer should
    send you a Form 1099-DIV. Enter your total ordinary dividends on line 3b. This amount should be shown in box 1a of Form(s)
    1099-DIV. If you are including your child''s ordinary dividends in the total on line 3b, check box 2 on line 3c. For more
    information, see the Instructions for Form 8814. You must fill in and attach Schedule B if the total is over $1,500 or
    you received, as a nominee, ordinary dividends that actually belong to someone else. Nondividend Distributions Some distributions
    are a return of your cost (or other basis). They won''t be taxed until you recover your cost (or other basis). You must
    reduce your cost (or other basis) by these distributions. After you get back all of your cost (or other basis), you must
    report these distributions as capital gains on Form 8949. For details, see Pub. 550. Dividends on insurance policies are
    a partial return of the premiums you paid. Don''t report them as dividends. Include them in income on Schedule 1, line
    8z, only if they exceed the total of all net premiums you paid for the contract. If you are including your child''s dividends
    on either line 3a or 3b, check the applicable box on line 3c. Lines 4a, 4b, and 4c Lines 4a and 4b IRA Distributions You
    should receive a Form 1099-R showing the total amount of any distribution from your IRA before income tax or other deductions
    were withheld. This amount should be shown in box 1 of Form 1099-R. Unless otherwise noted in the line 4a and 4b instructions,
    an IRA includes a traditional IRA (which includes a traditional IRA that receives contributions from a simplified employee
    pension (SEP) arrangement), Roth IRA (which includes a Roth IRA that receives contributions from a SEP arrangement), and
    a SIMPLE IRA (a SIMPLE IRA may either be a traditional SIMPLE IRA or a Roth SIMPLE IRA). If the distribution from your
    IRA is fully taxable, enter the total distribution on line 4b; don''t make an entry on line 4a. Attach Form(s) 1099-R
    to Form 1040 or 1040-SR if any federal income tax was withheld. For purposes of the following Exceptions, Roth IRA includes
    a Roth SIMPLE IRA. Exception 1. Enter the total distribution on line 4a if you rolled over part or all of the distribution
    from one: Roth IRA to another Roth IRA, or IRA (other than a Roth IRA) to a qualified plan or another IRA (other than
    a Roth IRA). Also check box 1 on line 4c. If the total distribution was rolled over, enter -0- on line 4b. If the total
    distribution wasn''t rolled over, enter the part not rolled over on line 4b unless Exception 2 applies to the part not
    rolled over. Generally, a rollover must be made within 60 days after the day you received the distribution. For more details
    on rollovers, see Pub. 590-A and Pub. 590-B. If you rolled over the distribution into a qualified plan or you made the
    rollover in 2026, include a statement explaining what you did. Exception 2. If any of the following apply, enter the total
    distribution on line 4a and see Form 8606 and its instructions to figure the amount to enter on line 4b. You received
    a distribution from an IRA (other than a Roth IRA) and you made nondeductible contributions to any of your traditional
    IRAs for 2025 or an earlier year. If you made nondeductible contributions to these IRAs for 2025, also see Pub. 590-A
    and Pub. 590-B. You received a distribution from a Roth IRA. But if either (a) or (b) below applies, enter -0- on line
    4b; you don''t have to see Form 8606 or its instructions. Distribution code T is shown in box 7 of Form 1099-R and you
    made a contribution (including a conversion) to a Roth IRA for 2020 or an earlier year. Distribution code Q is shown in
    box 7 of Form 1099-R. You converted part or all of a traditional IRA or traditional SIMPLE IRA to a Roth IRA in 2025.
    You had a 2024 or 2025 IRA contribution returned to you, with the related earnings or less any loss, by the due date (including
    extensions) of your tax return for that year. You made excess contributions to your IRA for an earlier year and had them
    returned to you in 2025. You recharacterized part or all of a contribution to a Roth IRA as a contribution to a traditional
    IRA, or vice versa. Exception 3. If all or part of the distribution is a qualified charitable distribution (QCD), enter
    the total distribution on line 4a. If the total amount distributed is a QCD, enter -0- on line 4b. If only part of the
    distribution is a QCD, enter the part that is not a QCD on line 4b unless Exception 2 applies to that part. Check box
    2 on line 4c. A QCD is a distribution made directly by the trustee of your IRA (other than an ongoing SEP or SIMPLE IRA)
    to an organization eligible to receive tax-deductible contributions (with certain exceptions). You must have been at least
    age 70 1/2 when the distribution was made. Generally, your total QCDs for the year can''t be more than $108,000. This
    includes any amount (up to $54,000) of a one-time QCD to a split-interest entity (SIE). If you file a joint return, the
    same rules apply to your spouse. The amount of the QCD is limited to the amount that would otherwise be included in your
    income. If your IRA includes nondeductible contributions, the distribution is first considered to be paid out of otherwise
    taxable income. If you make the one-time QCD to an SIE, you must attach a statement to your return. See Pub. 590-B for
    details on QCDs, including the information you must include on the attachment for QCDs to an SIE. You can''t claim a charitable
    contribution deduction for any QCD not included in your income. Exception 4. If all or part of the distribution is a health
    savings account (HSA) funding distribution (HFD), enter the total distribution on line 4a. If the total amount distributed
    is an HFD and you elect to exclude it from income, enter -0- on line 4b. If only part of the distribution is an HFD and
    you elect to exclude that part from income, enter the part that isn''t an HFD on line 4b unless Exception 2 applies to
    that part. Check box 3 on line 4c and enter "HFD" in the entry space next to box 3. An HFD is a distribution made directly
    by the trustee of your IRA (other than an ongoing SEP or SIMPLE IRA) to your HSA. If eligible, you can generally elect
    to exclude an HFD from your income once in your lifetime. You can''t exclude more than the limit on HSA contributions
    or more than the amount that would otherwise be included in your income. If your IRA includes nondeductible contributions,
    the HFD is first considered to be paid out of otherwise taxable income. See Pub. 969 for details. The amount of an HFD
    reduces the amount you can contribute to your HSA for the year. If you fail to maintain eligibility for an HSA for the
    12 months following the month of the HFD, you may have to report the HFD as income and pay an additional tax. See Form
    8889, Part III. More than one distribution. If you (or your spouse if filing jointly) received more than one distribution,
    figure the taxable amount of each distribution and enter the total of the taxable amounts on line 4b. Enter the total
    amount of those distributions on line 4a. You must start receiving at least a minimum amount from your traditional IRA
    by April 1 of the year following the year you reach age 73. If you don''t receive the minimum distribution amount, you
    may have to pay an additional tax on the amount that should have been distributed. For details, including how to figure
    the minimum required distribution, see Pub. 590-B. You may have to pay an additional tax if you received an early distribution
    from your IRA and the total wasn''t rolled over. See the instructions for Schedule 2, line 8, for details. More information.
    For more information about IRAs, see Pub. 590-A and Pub. 590-B. Line 4c If Exception 1 applies to you, check box 1 on
    line 4c. If Exception 3 applies to you, check box 2 on line 4c. If Exception 4 applies to you, check box 3 on line 4c
    and enter "HFD" in the entry space next to box 3. If another publication or instruction tells you to write a word or code
    next to line 4b, check box 3 on line 4c and enter that word or code on the entry space next to box 3. If more than one
    exception applies, check a box for each exception and include a statement showing the amount of each exception, for example,
    "Line 4b - $1,000 Rollover and $500 HFD." You don''t need to attach a statement if only Exception 2 and one other exception
    apply. Lines 5a, 5b, and 5c Lines 5a and 5b Pensions and Annuities You should receive a Form 1099-R showing the total
    amount of your pension and annuity payments before income tax or other deductions were withheld. This amount should be
    shown in box 1 of Form 1099-R. Pension and annuity payments include distributions from 401(k), 403(b), and governmental
    457(b) plans. Rollovers and lump-sum distributions are explained later. Don''t include the following payments on lines
    5a and 5b. Instead, report them on line 1h. Disability pensions received before you reach the minimum retirement age set
    by your employer. Corrective distributions (including any earnings) of excess elective deferrals or other excess contributions
    to retirement plans. The plan must advise you of the year(s) the distributions are includible in income. Attach Form(s)
    1099-R to Form 1040 or 1040-SR if any federal income tax was withheld. Fully Taxable Pensions and Annuities Your payments
    are fully taxable if (a) you didn''t contribute to the cost (see Cost, later) of your pension or annuity, or (b) you got
    your entire cost back tax free before 2025. But see Insurance Premiums for Retired Public Safety Officers, later. If your
    pension or annuity is fully taxable, enter the total pension or annuity payments (from Form(s) 1099-R, box 1) on line
    5b; don''t make an entry on line 5a. Fully taxable pensions and annuities also include military retirement pay shown on
    Form 1099-R. For details on military disability pensions, see Pub. 525. If you received a Form RRB-1099-R, see Pub. 575
    to find out how to report your benefits. Partially Taxable Pensions and Annuities Enter the total pension or annuity payments
    (from Form 1099-R, box 1) on line 5a. If your Form 1099-R doesn''t show the taxable amount, you must use the General Rule
    explained in Pub. 939 to figure the taxable part to enter on line 5b. But if your annuity starting date (defined later)
    was after July 1, 1986, see Simplified Method, later, to find out if you must use that method to figure the taxable part.
    You can ask the IRS to figure the taxable part for you for a $1,000 fee. For details, see Pub. 939. If your Form 1099-R
    shows a taxable amount, you can report that amount on line 5b. But you may be able to report a lower taxable amount by
    using the General Rule or the Simplified Method or if the exclusion for retired public safety officers, discussed next,
    applies. Insurance Premiums for Retired Public Safety Officers If you are an eligible retired public safety officer (law
    enforcement officer, firefighter, chaplain, or member of a rescue squad or ambulance crew who is retired because of disability
    or because you reached normal retirement age), you can elect to exclude from income distributions made from your eligible
    retirement plan that are used to pay the premiums for coverage by an accident or health plan or a long-term care insurance
    contract. The premiums can be for coverage for you, your spouse, or dependents. The distribution must be from the plan
    maintained by the employer from which you retired as a public safety officer. The distribution can be made directly from
    the plan to the provider of the accident or health plan or long-term care insurance contract, or the distribution can
    be made to you to pay to the provider of the accident or health plan or long-term care insurance contract. You can exclude
    from income the smaller of the amount of the premiums paid or $3,000. You can make this election only for amounts that
    would otherwise be included in your income. The amount excluded from your income can''t be used to claim a medical expense
    deduction. An eligible retirement plan is a governmental plan that is a qualified trust or a section 403(a), 403(b), or
    457(b) plan. You can exclude from income only the smaller of the amount of the premiums paid or $3,000. This is true if
    the distribution was made directly from the plan to the provider of the accident or health plan or long-term care insurance
    contract or if the distribution was made to you and you paid the provider of the accident or health plan or long-term
    care insurance contract. If you received a distribution from your eligible retirement plan, and you used part of that
    distribution to pay premiums for an accident or health plan or long-term care insurance contract, you can still exclude
    from income only the smaller of the amount of the premiums paid or $3,000. The rest of the distribution is taxable to
    you and must be reported on line 5b. If you make this election, reduce the otherwise taxable amount of your pension or
    annuity by the amount excluded. The amount shown in box 2a of Form 1099-R doesn''t reflect the exclusion. Report your
    total distributions on line 5a and the taxable amount on line 5b. Also check box 2 on line 5c. Simplified Method Worksheet-Lines
    5a and 5b Simplified Method Worksheet-Lines 5a and 5b Simplified Method Worksheet-Lines 5a and 5b Simplified Method Worksheet-Lines
    5a and 5b Summary: This is the simplified method worksheet. It is used to figure the taxable part of your pension or annuity
    using the simplified method. Before you begin: If you are the beneficiary of a deceased employee or former employee who
    died before August 21, 1996, include any death benefit exclusion that you are entitled to (up to $5,000) in the amount
    entered on line 2 below. Before you begin: More than one pension or annuity. If you had more than one partially taxable
    pension or annuity, figure the taxable part of each separately. Enter the total of the taxable parts on Form 1040 or 1040-SR,
    line 5b. Enter the total pension or annuity payments received in 2025 on Form 1040 or 1040-SR, line 5a. The line items
    to be completed are: "1. Enter the total pension or annuity payments from Form 1099-R, box 1. Also, enter this amount
    on Form 1040 or 1040-SR, line 5a." field "2. Enter your cost in the plan at the annuity starting date. Note. If you completed
    this worksheet last year, skip line 3 and enter the amount from line 4 of last year''s worksheet on line 4 below (even
    if the amount of your pension or annuity has changed). Otherwise, go to line 3." field "3. Enter the appropriate number
    from Table 1 below. But if your annuity starting date was after 1997 and the payments are for your life and that of your
    beneficiary, enter the appropriate number from Table 2 below." field "4. Divide line 2 by the number on line 3." field
    "5. Multiply line 4 by the number of months for which this year''s payments were made. If your annuity starting date was
    before 1987, skip lines 6 and 7 and enter this amount on line 8. Otherwise, go to line 6." field "6. Enter the amount,
    if any, recovered tax free in years after 1986. If you completed this worksheet last year, enter the amount from line
    10 of last year''s worksheet." field "7. Subtract line 6 from line 2." field "8. Enter the smaller of line 5 or line 7."
    field "9. Taxable amount. Subtract line 8 from line 1. Enter the result, but not less than zero. Also, enter this amount
    on Form 1040 or 1040-SR, line 5b. If your Form 1099-R shows a larger amount, use the amount on this line instead of the
    amount from Form 1099-R. If you are a retired public safety officer, see Insurance Premiums for Retired Public Safety
    Officers before entering an amount on line 5b." field "10. Was your annuity starting date before 1987?" "Yes. STOP. Do
    not complete the rest of this worksheet."checkbox, field "No. Add lines 6 and 8. This is the amount you have recovered
    tax free through 2025. You will need this number if you need to fill out this worksheet next year." checkbox, field "11.
    Balance of cost to be recovered. Subtract line 10 from line 2. If zero, you won''t have to complete this worksheet next
    year. The payments you receive next year will generally be fully taxable."field Table 1 for Line 3 Above IF the age at
    annuity starting date was AND your annuity starting date was before November 19, 1996, enter on line 3 AND your annuity
    starting date was after November 18, 1996, enter on line 3 55 or under 300 360 56-60 260 310 61-65 240 260 66-70 170 210
    71 or older 120 160 Table 2 for Line 3 Above IF the combined ages at annuity starting date were THEN enter on line 3 110
    or under 410 111-120 360 121-130 310 131-140 260 141 or older 210 Please click here for the text description of the image.
    If you are retired on disability and reporting your disability pension on line 1h, include only the taxable amount on
    that line and enter "PSO" and the amount excluded on the line next to line 1h. Payments when you are disabled. If you
    receive payments from a retirement or profit-sharing plan that does not provide for disability retirement, do not treat
    those payments as disability payments. The payments must be reported as a pension or annuity. You must include in your
    income any amounts that you received that you would have received in retirement had you not become disabled as a result
    of a terrorist attack. Include in your income any payments you receive from a 401(k), pension, or other retirement plan
    to the extent that you would have received the amount at the same or later time regardless of whether you had become disabled.
    Example. You were a contractor who was disabled as a direct result of participating in efforts to clean up the World Trade
    Center and you are eligible for compensation by the September 11 Victim Compensation Fund. You began receiving a disability
    pension at age 55 when you could no longer work due to your disability. Under your pension plan, you are entitled to an
    early retirement benefit of $2,500 a month at age 55. If you wait until age 62, the normal retirement age under the plan,
    you would be entitled to a normal retirement benefit of $3,000 a month. The pension plan provides that a participant who
    retires early on account of disability is entitled to receive the participant''s normal retirement benefit, which in your
    case equals $3,000 a month. Until you turn age 62, you can exclude $500 of your monthly retirement benefit from income
    (the difference between the early retirement benefit and the normal retirement benefit, $3,000 - $2,500) received on account
    of disability. You must report the remaining $2,500 of monthly pension benefit as taxable. For each month after you turn
    age 62, you must report the full amount of the monthly pension benefit ($3,000 a month) as taxable. Simplified Method
    You must use the Simplified Method if either of the following applies. Your annuity starting date was after July 1, 1986,
    and you used this method last year to figure the taxable part. Your annuity starting date was after November 18, 1996,
    and both of the following apply. The payments are from a qualified employee plan, a qualified employee annuity, or a tax-sheltered
    annuity. On your annuity starting date, either you were under age 75 or the number of years of guaranteed payments was
    fewer than 5. See Pub. 575 for the definition of guaranteed payments. If you must use the Simplified Method, complete
    the Simplified Method Worksheet in these instructions to figure the taxable part of your pension or annuity. For more
    details on the Simplified Method, see Pub. 575 (or Pub. 721 for U.S. Civil Service retirement benefits). If you received
    U.S. Civil Service retirement benefits and you chose the alternative annuity option, see Pub. 721 to figure the taxable
    part of your annuity. Do not use the Simplified Method Worksheet in these instructions. Annuity Starting Date Your annuity
    starting date is the later of the first day of the first period for which you received a payment or the date the plan''s
    obligations became fixed. Age (or Combined Ages) at Annuity Starting Date If you are the retiree, use your age on the
    annuity starting date. If you are the survivor of a retiree, use the retiree''s age on their annuity starting date. But
    if your annuity starting date was after 1997 and the payments are for your life and that of your beneficiary, use your
    combined ages on the annuity starting date. If you are the beneficiary of an employee who died, see Pub. 575. If there
    is more than one beneficiary, see Pub. 575 or Pub. 721 to figure each beneficiary''s taxable amount. Cost Your cost is
    generally your net investment in the plan as of the annuity starting date. It doesn''t include pre-tax contributions.
    Your net investment may be shown in box 9b of Form 1099-R. Rollovers Generally, a rollover is a tax-free distribution
    of cash or other assets from one retirement plan that is contributed to another plan within 60 days of receiving the distribution.
    However, a rollover to a Roth IRA or a designated Roth account is generally not a tax-free distribution. Use lines 5a
    and 5b to report a rollover, including a direct rollover, from one qualified employer''s plan to another or to an IRA.
    Enter on line 5a the distribution from Form 1099-R, box 1. From this amount, subtract any contributions (usually shown
    in box 5) that were taxable to you when made. From that result, subtract the amount of the rollover. Enter the remaining
    amount on line 5b. If the remaining amount is zero and you have no other distribution to report on line 5b, enter -0-
    on line 5b. Also check box 1 on line 5c. See Pub. 575 for more details on rollovers, including special rules that apply
    to rollovers from designated Roth accounts, partial rollovers of property, and distributions under qualified domestic
    relations orders. Lump-Sum Distributions If you received a lump-sum distribution from a profit-sharing or retirement plan,
    your Form 1099-R should have the "Total distribution" box in box 2b checked. You may owe an additional tax if you received
    an early distribution from a qualified retirement plan and the total amount wasn''t rolled over. For details, see the
    instructions for Schedule 2, line 8. Enter the total distribution on line 5a and the taxable part on line 5b. For details,
    see Pub. 575. If you or the plan participant was born before January 2, 1936, you could pay less tax on the distribution.
    See Form 4972. Line 5c If you have a rollover, including a direct rollover, from one qualified employer''s plan to another
    or to an IRA, check box 1 on line 5c. See Rollovers, earlier, for more information. If you are making the election to
    exclude from your income distributions made from your eligible retirement plan to pay premiums for coverage by an accident
    or health plan or a long-term care contract, check box 2 on line 5c. See Insurance Premiums for Retired Public Safety
    Officers, earlier, for more information. If another publication or instruction tells you to write a word or a code next
    to line 5b, check box 3 on line 5c and enter that word or code on the entry space next to box 3. Check each box that applies
    to you. Lines 6a, 6b, 6c, and 6d Lines 6a and 6b Social Security Benefits You should receive a Form SSA-1099 showing in
    box 3 the total social security benefits paid to you. Box 4 will show the amount of any benefits you repaid in 2025. If
    you received railroad retirement benefits treated as social security, you should receive a Form RRB-1099. Use the Social
    Security Benefits Worksheet in these instructions to see if any of your benefits are taxable. Exception. Do not use the
    Social Security Benefits Worksheet in these instructions if any of the following applies. You made contributions to a
    traditional IRA for 2025 and you or your spouse were covered by a retirement plan at work or through self-employment.
    Instead, use the worksheets in Pub. 590-A to see if any of your social security benefits are taxable and to figure your
    IRA deduction. You repaid any benefits in 2025 and your total repayments (box 4) were more than your total benefits for
    2025 (box 3). None of your benefits are taxable for 2025. Also, if your total repayments in 2025 exceed your total benefits
    received in 2025 by more than $3,000, you may be able to take an itemized deduction or a credit for part of the excess
    repayments if they were for benefits you included in income in an earlier year. For more details, see Pub. 915. You file
    Form 2555, 4563, or 8815, or you exclude employer-provided adoption benefits or income from sources within Puerto Rico.
    Instead, use the worksheet in Pub. 915. Social security information. Social security beneficiaries can now get a variety
    of information from the SSA website with a my Social Security account, including getting a replacement Form SSA1099 if
    needed. For more information and to set up an account, go to SSA.gov/myaccount. Disability payments. Don''t include in
    your income any disability payments (including Social Security Disability Insurance (SSDI) payments) you receive for injuries
    incurred as a direct result of a terrorist attack directed against the United States (or its allies), whether outside
    or within the United States. In the case of the September 11 attacks, injuries eligible for coverage by the September
    11 Victim Compensation Fund are treated as incurred as a direct result of the attack. If these payments are incorrectly
    reported as taxable on Form SSA-1099, don''t include the nontaxable portion of income on your tax return. You may receive
    a notice from the IRS regarding the omitted payments. Follow the instructions in the notice to explain that the excluded
    payments aren''t taxable. For more information about these payments, see Pub. 3920. Example. You were a firefighter who
    was disabled as a direct result of the September 11 terrorist attack on the World Trade Center. You began receiving SSDI
    benefits at age 54. Your full retirement age for social security retirement benefits is age 66. Your birthday is April
    25. In the year you turned age 66, you received $1,500 per month in benefits from the SSA (for a total of $18,000 for
    the year). Because you became eligible for a full retirement benefit in May, the month after you turned age 66, you can
    exclude only 4 months (January through April) of your annual benefit from income ($6,000). You must report the remaining
    $12,000 on line 6a. You must also complete the Social Security Benefits Worksheet to find out if any part of the $12,000
    is taxable. Form RRB-1099. If you need a replacement Form RRB-1099, call the Railroad Retirement Board at 877-772-5772
    or go to www.rrb.gov. Accrued leave payment. If you retire on disability, any lump-sum payment you receive for accrued
    annual leave is a salary payment. The payment is not a disability payment. Include it in your income in the tax year you
    receive it. Social Security Benefits Worksheet-Lines 6a and 6b Tax Tables If the instructions for Schedule 1, line 24z,
    have you enter a write-in adjustment on line 24z, figure that write-in before completing this worksheet (see the instructions
    for Schedule 1, line 24z). If you are married filing separately and you lived apart from your spouse for all of 2025,
    check the box on line 6d. Be sure you have read the Exception in the line 6a and 6b instructions to see if you can use
    this worksheet instead of a publication to find out if any of your benefits are taxable. 1. Enter the total amount from
    box 5 of all your Forms SSA-1099 and RRB-1099. Also enter this amount on Form 1040 or 1040-SR, line 6a 1. _____ 2. Multiply
    line 1 by 50% (0.50) 2. _____ 3. Combine the amounts from Form 1040 or 1040-SR, lines 1z, 2b, 3b, 4b, 5b, 7a, and 8 3.
    _____ 4. Enter the amount, if any, from Form 1040 or 1040-SR, line 2a 4. _____ 5. Combine lines 2, 3, and 4 5. _____ 6.
    Enter the total of the amounts from Schedule 1, lines 11 through 20, and 23 and 25 6. _____ 7. Is the amount on line 6
    less than the amount on line 5? No. None of your social security benefits are taxable. Enter -0- on Form 1040 or 1040-SR,
    line 6b. Yes. Subtract line 6 from line 5 7. _____ 8. If you are: Married filing jointly, enter $32,000 Single, head of
    household, qualifying surviving spouse, or married filing separately and you lived apart from your spouse for all of 2025,
    enter $25,000 8. _____ Married filing separately and you lived with your spouse at any time in 2025, skip lines 8 through
    15; multiply line 7 by 85% (0.85) and enter the result on line 16. Then, go to line 17 9. Is the amount on line 8 less
    than the amount on line 7? No. None of your social security benefits are taxable. Enter -0- on Form 1040 or 1040-SR, line
    6b. If you are married filing separately and you lived apart from your spouse for all of 2025, be sure you checked the
    box on line 6d. Yes. Subtract line 8 from line 7'
