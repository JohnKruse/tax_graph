    Was your qualifying relative a U.S. citizen, U.S. national, U.S. resident alien, or a resident of Canada or Mexico? (See
    Pub. 519 for the definition of a U.S. national or U.S. resident alien. If your qualifying relative was adopted, see Exception
    to citizen test, later.) [ ] Yes. [ ] No. You can''t claim this person as a dependent. 3. Was your qualifying relative
