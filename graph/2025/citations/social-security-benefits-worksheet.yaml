    on Form 1040 or 1040-SR, line 5b. If your Form 1099-R shows a larger amount, use the amount on this line instead of the
    amount from Form 1099-R. If you are a retired public safety officer, see Insurance Premiums for Retired Public Safety
    Officers before entering an amount on line 5b." field "10. Was your annuity starting date before 1987?" "Yes. STOP. Do
    not complete the rest of this worksheet."checkbox, field "No. Add lines 6 and 8. This is the amount you have recovered
