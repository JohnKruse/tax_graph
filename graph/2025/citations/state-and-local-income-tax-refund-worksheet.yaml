- citation_id: cite_state_and_local_income_tax_refund_worksheet_2025_lines_2
  document_id: state_and_local_income_tax_refund_worksheet_2025
  source_document_id: instructions_form_1040_2025
  locator: source_document=instructions_form_1040_2025;worksheet=State and Local Income
    Tax Refund Worksheet;lines=2
  quoted_text: 2. Is the amount of state and local income taxes (or general sales
    taxes), real estate taxes, and personal property taxes paid in 2024 (generally,
    this is the amount reported on your 2024 Schedule A, line 5d) more than the amount
    on your 2024 Schedule A, line 5e? No. Enter the amount from line 1 on line 3 and
    go to line 4. 2. _____ Yes. Subtract the amount on your 2024 Schedule A, line
    5e, from the amount of state and local income taxes (or general sales taxes),
    real estate taxes, and personal property taxes paid in 2024 (generally, this is
    the amount reported on your 2024 Schedule A, line 5d).
