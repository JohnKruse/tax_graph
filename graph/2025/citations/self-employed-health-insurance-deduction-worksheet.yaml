  locator: source_document=instructions_form_1040_2025;worksheet=Self-Employed Health
    Insurance Deduction Worksheet;lines=1
  quoted_text: 1. Enter the total amount paid in 2025 for health insurance coverage
    established under your business (or the S corporation in which you were a more-than-2%
    shareholder) for 2025 for you, your spouse, and your dependents. Your insurance
    can also cover your child who was under age 27 at the end of 2025, even if the
    child wasn't your dependent. But don't include amounts for any month you were
    eligible to participate in an employer-sponsored health plan or amounts paid from
    retirement plan distributions that were nontaxable because you are a retired public
    safety officer
  kind: row
