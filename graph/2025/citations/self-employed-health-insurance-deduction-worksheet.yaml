  quoted_text: 2. Enter your net profit* and any other earned income** from the business
    under which the insurance plan is established, minus any deductions on Schedule
    1, lines 15 and 16. Don't include Conservation Reserve Program payments exempt
    from self-employment tax
  kind: row
  ranges:
