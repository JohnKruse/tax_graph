  source_document_id: instructions_form_1040_2025
  locator: source_document=instructions_form_1040_2025;worksheet=Simplified Method Worksheet;lines=9
  quoted_text: '"9. Taxable amount. Subtract line 8 from line 1. Enter the result, but not less than zero. Also, enter this
    amount on Form 1040 or 1040-SR, line 5b. If your Form 1099-R shows a larger amount, use the amount on this line instead
    of the amount from Form 1099-R. If you are a retired public safety officer, see Insurance Premiums for Retired Public
    Safety Officers before entering an amount on line 5b." field'
  kind: row
  ranges:
  - start: 375669
    end: 376118
