  quoted_text: The premium tax credit helps pay for health insurance purchased through the Marketplace. You may be eligible
    to claim the premium tax credit if you, your spouse, or a dependent enrolled in health insurance through the Marketplace.
    Eligible individuals may have advance payments of the premium tax credit made on their behalf directly to the insurance
    company. You (or whoever enrolled you) should have received Form 1095-A from the Marketplace with information about your
    coverage and any advance credit payments. Complete Form 8962 to determine the amount of your premium tax credit, if any.
    If the premium tax credit you can claim exceeds your advance credit payments, your net premium tax credit will be shown
    on Form 8962, line 26. Enter that amount, if any, on line 9. For more information, see the Instructions for Form 8962.
