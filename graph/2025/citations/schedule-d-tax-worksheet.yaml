    on Form 1040, 1040-SR, or 1040-NR, line 16. (If you are filing Form 2555, don't
    enter this amount on Form 1040 or 1040-SR, line 16. Instead, enter it on line
    4 of the Foreign Earned Income Tax Worksheet in the Instructions for Form 1040.)
