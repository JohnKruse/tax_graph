  quoted_text: 3. Is the amount on line 1 more than the amount on line 2? Yes. List
    the type (Form 8978 ADJ) and the amount from line 2 as a negative number (in parentheses)
    on line 17z. No. List the type (Form 8978 ADJ) and the amount from line 1 as a
    negative number (in parentheses) on line 17z. Combine this amount with any other
    amounts reported on line 17z to complete the line 17z entry space. * Chapter 1
    taxes include taxes from sections 1 through 1400Z-2 of the Code, as well as certain
    amounts the Code treats as chapter 1 taxes. Generally, this does not include amounts
    reported on Schedule 2, lines 4, 7, 9, 11-13, 17k-17m, or 17z (other than chapter
    1 taxes).
