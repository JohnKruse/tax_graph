  locator: Instructions for Schedule D, Capital Losses
  quoted_text: You can deduct capital losses up to the amount of your capital gains plus $3,000 ($1,500 if married filing
    separately). You may be able to use capital losses that exceed this limit in future years. For details, see the instructions
    for line 21. Be sure to report all of your capital gains and losses even if you can't use all of your losses in 2025.
