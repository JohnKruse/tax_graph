  source_document_id: instructions_form_1040_2025
  locator: source_document=instructions_form_1040_2025;worksheet=IRA Deduction Worksheet;lines=12
  quoted_text: 12. On line 12a, enter the **smallest** of line 7a, 10, or 11a. On
