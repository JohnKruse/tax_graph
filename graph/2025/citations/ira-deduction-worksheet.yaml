  locator: source_document=instructions_form_1040_2025;worksheet=IRA Deduction Worksheet;lines=8
  quoted_text: '8. Enter the total of your (and your spouse''s if filing jointly):
    Wages, salaries, tips, etc. Generally, this is the amount reported in box 1 of
    Form W-2. Exceptions are explained earlier in these instructions for line 20.
    Alimony and separate maintenance payments reported on Schedule 1, line 2a. Nontaxable
    combat pay. This amount should be reported in box 12 of Form W-2 with code Q or
    reported on Form 1040, line 1i'
  kind: row
  ranges:
  - start: 552638
    end: 553060
- citation_id: cite_ira_deduction_worksheet_2025_lines_9
  document_id: ira_deduction_worksheet_2025
  source_document_id: instructions_form_1040_2025
  locator: source_document=instructions_form_1040_2025;worksheet=IRA Deduction Worksheet;lines=9
  quoted_text: 9. Enter the earned income you (and your spouse if filing jointly)
    received as a self-employed individual or a partner. Generally, this is your (and
    your spouse's if filing jointly) net earnings from self-employment if your personal
    services were a material income-producing factor, minus any deductions on Schedule
    1, lines 15 and 16. If zero or less, enter -0-. For more details, see Pub. 590-A
  kind: row
  ranges:
  - start: 553082
    end: 553478
