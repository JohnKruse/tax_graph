  quoted_text: 7. Multiply lines 6a and 6b by the percentage below that applies to
    you. If the result isn't a multiple of $10, increase it to the next multiple of
    $10 (for example, increase $490.30 to $500). If the result is $200 or more, enter
    the result. But if it is less than $200, enter $200. Single, head of household,
    or married filing separately, multiply by 70% (0.70) (or by 80% (0.80) in the
    column for the IRA of a person who is age 50 or older at the end of 2025
