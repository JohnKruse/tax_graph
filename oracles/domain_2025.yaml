# M13 Step 1 injection contract: add a box to this live domain only after a
# shipped-source or live-probe check proves OTS honors direct injection verbatim.
# S1 8z and S1-A 2a pass that check. S1 21 does not: OTS treats its same-named
# box as PRE-worksheet interest paid and overwrites it with a capped, MAGI-phased
# POST-worksheet deduction. Tax Graph's S1 line 21 is the post-worksheet form
# line, so it remains an offline L4-witnessed input until the worksheet is modeled.
supplemental_inputs:
  - node_id: schedule_1_2025_part_i_line_8z
    ots_input: S1_8z
    min: 0
    max: 600
    include: [0, 60, 250, 600]
