[project]
name = "tax-graph"
version = "0.1.0a1"
description = "A deterministic, machine-readable computation graph for U.S. tax forms, served over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
keywords = ["tax", "mcp", "model-context-protocol", "irs", "computation-graph"]
dependencies = [
  "jsonschema>=4.0",
  "mcp>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/JohnKruse/tax_graph"
Repository = "https://github.com/JohnKruse/tax_graph"

[project.optional-dependencies]
policyengine = [
  "policyengine-us>=1.0",
]
pdf = [
  "pymupdf>=1.24",
]
acquire = [
  "httpx>=0.27",
  "mistralai>=1.0",
  "pymupdf>=1.24",
]
llm-anthropic = [
  "anthropic>=0.34",
]
llm-openai = [
  "openai>=1.0",
]
llm-openrouter = [
  "openai>=1.0",
]
llm = [
  "anthropic>=0.34",
  "openai>=1.0",
]
extract = [
  "anthropic>=0.34",
  "openai>=1.0",
]
oracles = [
]
build = [
  "anthropic>=0.34",
  "httpx>=0.27",
  "mistralai>=1.0",
  "openai>=1.0",
  "pymupdf>=1.24",
]
dev = [
  "anthropic>=0.34",
  "httpx>=0.27",
  "mistralai>=1.0",
  "openai>=1.0",
  "pymupdf>=1.24",
  "pytest>=8.0",
]

[project.scripts]
tax-graph = "tax_graph.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "m0: Phase M0 foundation tests",
  "m1: Phase M1 compile/runtime artifact tests",
  "m2: Phase M2 MCP server tests",
  "m3: Phase M3 acquisition tests",
  "m4: Phase M4 extraction tests",
  "m5: Phase M5 Return Record tests",
  "m6: Phase M6 differential oracle tests",
  "m6b: Phase M6b repeatable-table tests",
  "m7: Phase M7 frontier registry tests",
  "m8: Phase M8 extraction verification tests",
  "m9: Phase M9 Schedule D expansion tests",
  "m10: Phase M10 batch expansion tests",
  "m11: Phase M11 first liability branch tests",
  "m12: Phase M12 output layer tests",
  "network: tests that require live network access",
  "oracle: tests that require a pinned local oracle binary",
]
