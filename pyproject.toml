[project]
name = "tax-graph"
version = "0.1.0"
description = "A deterministic, machine-readable computation graph for U.S. tax forms."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "jsonschema>=4.0",
  "mcp>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
acquire = [
  "httpx>=0.27",
  "mistralai>=1.0",
  "pymupdf>=1.24",
]
llm-anthropic = [
  "anthropic>=0.34",
]
llm-openai = [
  "openai>=1.0",
]
llm-openrouter = [
  "openai>=1.0",
]
llm = [
  "anthropic>=0.34",
  "openai>=1.0",
]
extract = [
  "anthropic>=0.34",
  "openai>=1.0",
]
build = [
  "anthropic>=0.34",
  "httpx>=0.27",
  "mistralai>=1.0",
  "openai>=1.0",
  "pymupdf>=1.24",
]
dev = [
  "anthropic>=0.34",
  "httpx>=0.27",
  "mistralai>=1.0",
  "openai>=1.0",
  "pymupdf>=1.24",
  "pytest>=8.0",
]

[project.scripts]
tax-graph = "tax_graph.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "m0: Phase M0 foundation tests",
  "m1: Phase M1 compile/runtime artifact tests",
  "m2: Phase M2 MCP server tests",
  "m3: Phase M3 acquisition tests",
  "m4: Phase M4 extraction tests",
  "network: tests that require live network access",
]
