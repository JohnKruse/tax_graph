[project]
name = "tax-graph"
version = "0.1.0"
description = "A deterministic, machine-readable computation graph for U.S. tax forms."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "jsonschema>=4.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
tax-graph = "tax_graph.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "m0: Phase M0 foundation tests",
]
