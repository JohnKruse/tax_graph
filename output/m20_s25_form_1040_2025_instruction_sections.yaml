  heading: Line 25
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '### Line 25

    Federal Income Tax Withheld


    #### Line 25aForm(s) W-2


    Add the amounts shown as federal income tax withheld on your Form(s) W-2. Enter
    the total on line 25a. The amount withheld should be shown in box 2 of Form W-2.
    Attach your Form(s) W-2 to your return.


    #### Line 25bForm(s) 1099


    Include on line 25b any federal income tax withheld on your Form(s) 1099-R. The
    amount withheld should be shown in box 4. Attach your Form(s) 1099-R to the front
    of your return if federal income tax was withheld.


    If you received a 2025 Form 1099 showing federal income tax withheld on dividends,
    taxable or tax-exempt interest income, unemployment compensation, social security
    benefits, railroad retirement benefits, or other income you received, include
    the amount withheld in the total on line 25b. This should be shown in box 4 of
    Form 1099, box 6, of Form SSA-1099, or box 10 of Form RRB-1099.


    #### Line 25cOther Forms


    Include on line 25c any


    - Federal income tax withheld on your Form(s) W-2G. The amount withheld should
    be shown in box 4. Attach Form(s) W-2G to the front of your return if federal
    income tax was withheld.


    - Additional Medicare Tax you had withheld. Include the amount shown on Form 8959,
    line 24, in the total on line 25c. Attach Form 8959.


    - Federal income tax withheld that is shown on a Schedule K-1.


    - Tax withheld that is shown on Form 1042-S, Form 8805, or Form 8288-A. To assist
    in processing, attach the form to your return to claim a credit for the withholding.


    '
