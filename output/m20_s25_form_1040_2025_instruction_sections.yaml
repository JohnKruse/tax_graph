  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '### Lines 5a and 5b Pensions and Annuities


    You should receive a Form 1099-R showing the total amount of your pension and
    annuity payments before income tax or other deductions were withheld. This amount
    should be shown in box 1 of Form 1099-R. Pension and annuity payments include
    distributions from 401(k), 403(b), and governmental 457(b) plans. Rollovers and
    lump-sum distributions are explained later. Dont include the following payments
    on lines 5a and 5b. Instead, report them on line 1h.


    - Disability pensions received before you reach the minimum retirement age set
    by your employer.

    - Corrective distributions (including any earnings) of excess elective deferrals
    or other excess contributions to retirement plans. The plan must advise you of
    the year(s) the distributions are includable in income.


    Attach Form(s) 1099-R to Form 1040 or 1040-SR if any federal income tax was withheld.


    '
