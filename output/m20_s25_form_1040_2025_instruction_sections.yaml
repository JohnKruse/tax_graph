  heading: Lines 27a, 27b, and 27cEarned Income Credit (EIC)
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: "# Lines 27a, 27b, and 27cEarned Income Credit (EIC)\n\n## What Is the EIC?\n\
    \nThe EIC is a credit for certain people who work. The credit may give you a refund\
    \ even if you don't owe any tax or didn't have any tax withheld.\n\n## To Take\
    \ the EIC:\n\n- Follow the steps in the following flowchart.\n- Complete the worksheet\
    \ that applies to you or let the IRS figure the credit for you.\n- Review the\
    \ SSN requirements for claiming the EIC under *Social security number* (SSN) in\
    \ the *Definitions and Special Rules* section, later.\n- If you have at least\
    \ one child who meets the conditions to be your qualifying child for purposes\
