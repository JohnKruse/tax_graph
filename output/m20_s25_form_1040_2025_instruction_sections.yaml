  heading: Line 2
  context_heading: Instructions for Schedule 2
  text: '## Line 2


    ### Alternative Minimum Tax (AMT)


    The AMT exemption amount is increased to $88,100 ($137,000 if married filing jointly
    or qualifying surviving spouse; $68,500 if married filing separately). The income
    levels at which the AMT exemption begins to phase out has increased to $626,350
    ($1,252,700 if married filing jointly or qualifying surviving spouse).


    See the Instructions for Form 6251 to see if you must file the form and then use
    Form 6251 to figure the amount, if any, of your AMT. Enter the amount from Form
    6251, line 11, on line 2.


    For help with the alternative minimum tax, go to IRS.gov/AMT.


    '
