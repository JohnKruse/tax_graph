    8911). Identify as "ARPCR."

    2. Any EPE related to the credit applied against tax from Form 8933 reported on
    Form 4255, line 2a, column (k). Identify as "EPE8933."

    3. Recapture of any non-EPE credit from Form 8933 reported on Form 4255, line
    2a, column (j). Also, any section 6418(g)(3) amounts attributable to recapture
    from Form 8933 reported on Form 4255, line 2a, column (m)(3). Identify as "NEPE8933."

    4. Any amount that was reported on Form 4255, column (n)(2), line 1a, 1c, 1d,
    and/or 2a. Identify as "EPGEPE."

    5. Any section 6418(g)(2) excessive credit transfer amount reported on Form 4255,
    column (m)(1) and (m)(2). Identify as "6418(g)(2)."


    111


    # Page 112

    **TIP** For more information about elective pay and credit transferability, go
    to IRS.gov/Credits-Deductions/Elective-Pay-and-Transferability-Frequently-Asked-Questions-Transferability.


    '
