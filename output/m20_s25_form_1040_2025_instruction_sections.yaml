  heading: Line 1a
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '### Line 1a


    #### Total Amount From Form(s) W-2, Box 1


    Enter the total amount from Form(s) W-2, box 1. If a joint return, also include
    your spouse''s income from Form(s) W-2, box 1.


    If you earned wages while you were an inmate in a penal institution, report these
    amounts on Schedule 1, line 8u. Do not report these wages on line 1a. See the
    instructions for Schedule 1, line 8u.


    Need more information or forms? Visit IRS.gov.


    23


    # Page 24

    *If you received a pension or annuity from a nonqualified deferred compensation
    plan or a nongovernmental section 457 plan and it was reported in box 1 of Form
    W-2, do not include this amount on Form 1040, line 1a. This amount is reported
    on Schedule 1, line 8t.*


    '
