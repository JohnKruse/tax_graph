  text: '## Line 4c


    If *Exception 1* applies to you, check box 1 on line 4c. If *Exception 3* applies
    to you, check box 2 on line 4c. If *Exception 4* applies to you, check box 3 on
    line 4c and enter HFD in the entry space next to box 3.


    If another publication or instruction tells you to write a word or code next to
    line 4b, check box 3 on line 4c and enter that word or code on the entry space
    next to box 3.


    If more than one exception applies, check a box for each exception and include
    a statement showing the amount of each exception, for example, Line 4b  $1,000
    Rollover and $500 HFD. You dont need to attach a statement if only *Exception
    2* and one other exception apply.


    '
