  text: '### Line 27b


    Check the box on line 27b if you are (1) a minister, member of a religious order
    who has not taken a vow of poverty, or a Christian Science practitioner; and (2)
    filing Schedule SE and the amount on line 2 of that schedule includes an amount
    that was also reported on Form 1040 or 1040-SR, line 1z. See the instructions
    under Clergy, later, for how to determine the amount of your earned income.


    '
