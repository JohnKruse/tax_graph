  heading: Line 8o
  context_heading: Additional Income and Adjustments to Income
  text: '#### Line 8o


    **Section 951A(a) inclusion.** Section 951A generally requires that a U.S. shareholder
    of a controlled foreign corporation include in income its global intangible low-taxed
    income (GILTI). Enter on line 8o from your Forms 8992 the sum of any amounts reported
    on Part II, line 5. Remember to attach copies of your Forms 8992.


    If you made a section 962 election and have an income inclusion under section
    951 or 951A, do not report that income on line 8n or 8o, as applicable. Instead,
    report the tax with respect to the section 962 election on Form 1040 or 1040-SR,
    line 16, and attach a statement showing how you figured the tax that includes
    the gross amounts of section 951 and section 951A income.


