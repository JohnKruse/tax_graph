- section_id: instruction_section_instructions_form_1040_2025_0059
  document_id: form_1040_2025
  line: '38'
  line_tokens:
  - '38'
  heading: Line 38
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 38


    ### Estimated Tax Penalty


    You may owe this penalty if:


    -  Line 37 is at least $1,000 and it is more than 10% of the tax shown on your
    return, or

    -  You didn''t pay enough estimated tax by any of the due dates. This is true
    even if you are due a refund.


    For most people, the "tax shown on your return" is the amount on your 2025 Form
    1040 or 1040-SR, line 24, minus the total of any amounts shown on lines 27a, 28,
    29, and 30; Schedule 3, lines 9 and 12; and Forms 8828, 4137, 5329 (Parts III
    through IX only), and 8919. Also subtract from line 24 any:


    -  Tax on an excess parachute payment,

    -  Excise tax on insider stock compensation of an expatriated corporation,

    -  Uncollected social security and Medicare or RRTA tax on tips or group-term
    life insurance,

    -  Look-back interest due under section 167(g) or 460(b).


    When figuring the amount on line 24, include household employment taxes only if
    line 25d is more than zero or you would owe the penalty even if you didn''t include
    those taxes.


    **Exception.** You won''t owe the penalty if your 2024 tax return was for a tax
    year of 12 full months and either of the following applies.


    1. You had no tax shown on your 2024 return and you were a U.S. citizen or resident
    for all of 2024.


    2. The total of lines 25d, 26, and Schedule 3, line 11, on your 2025 return is
    at least 100% of the tax shown on your 2024 return (110% of that amount if you
    aren''t in the business of farming or fishing, and your adjusted gross income
    (AGI) shown on your 2024 return was more than $150,000 (more than $75,000 if married
    filing separately for 2025)). Your estimated tax payments for 2025 must have been
    made on time and for the required amount.


    For most people, the "tax shown on your 2024 return" is the amount on your 2024
    Form 1040 or 1040-SR, line 24, minus the total of any amounts shown on lines 27,
    28, and 29; Schedule 3,


    lines 9 and 12; and Forms 8828, 4137, 5329 (Parts III through IX only), and 8919.
    Also subtract from line 24 any:


    -  Tax on an excess parachute payment,

    -  Excise tax on insider stock compensation of an expatriated corporation,

    -  Uncollected social security and Medicare or RRTA tax on tips or group-term
    life insurance, and

    -  Look-back interest due under section 167(g) or 460(b).


    When figuring the amount on line 24, include household employment taxes only if
    line 25d is more than zero or you would have owed the estimated tax penalty for
    2024 even if you didn''t include those taxes.


    If the *Exception* just described doesn''t apply, see the Instructions for Form
    2210 for other situations in which you may be able to lower your penalty by filing
    Form 2210.


    ### Figuring the Penalty


    If you choose to figure the penalty yourself, use Form 2210 (or 2210-F for farmers
    and fishers).


    Enter any penalty on line 38. Add the penalty to any tax due and enter the total
    on line 37.


    However, if you have an overpayment on line 34, subtract the penalty from the
    amount you would otherwise enter on line 35a or line 36. Lines 35a, 36, and 38
    must equal line 34.


    If the penalty is more than the overpayment on line 34, enter -0- on lines 35a
    and 36. Then, subtract line 34 from line 38 and enter the result on line 37.


    Don''t file Form 2210 with your return unless Form 2210 indicates that you must
    do so. Instead, keep it for your records.


    **TIP** *Because Form 2210 is complicated, you can leave line 38 blank and the
    IRS will figure the penalty and send you a bill. We won''t charge you interest
    on the penalty if you pay by the date specified on the bill. There are situations
    where the IRS can''t figure your penalty for you and you must file Form 2210.
    See Form 2210 for details.*


    '
