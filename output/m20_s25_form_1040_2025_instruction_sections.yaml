  heading: Line 7
  context_heading: Additional Income and Adjustments to Income
  text: '## Line 7


    ### Unemployment Compensation


    You should receive a Form 1099-G showing in box 1 the total unemployment compensation
    paid to you in 2025. Report this amount on line 7.


    If the amount reported in box 1 of your Form(s) 1099-G is incorrect, report on
    line 7 only the actual amount of unemployment compensation paid to you in 2025.


    If you made contributions to a governmental unemployment compensation program
    and you aren''t itemizing deductions, reduce the amount you report on line 7 by
    those contributions. If you are itemizing deductions, see the instructions on
    Form 1099-G.


    If you received an overpayment of unemployment compensation in 2025, subtract
    the amount you repaid from the total amount you received. Enter the result on
    line 7. Also, check the box on line 7 and enter the amount you repaid in the entry
    space. If, in 2025, you repaid more than $3,000 of unemployment compensation that
    you included in gross income in an earlier year, see Repayments in Pub. 525 for
    details on how to report the payment.


    Beginning in 2025, if you made contributions to a governmental paid family leave
    program, you will now include the full amount of those contributions in your income.
    If you itemize your deductions on Schedule A, you can include the amounts contributed
    as part of the state and local taxes that you paid.


    If you received unemployment compensation in 2025, your state may issue an electronic
    Form 1099-G instead of it being mailed to you. Check your state''s unemployment
    compensation website for more information.


    '
