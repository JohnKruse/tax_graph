  heading: Line 35c
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '### Line 35c


    Check the appropriate box for the type of account. Don''t check more than one
    box. If the deposit is to an account such as an IRA, health savings account, brokerage
    account, or other similar account, ask your financial institution whether you
    should check the "Checking" or "Savings" box. You must check the correct box to
    ensure your deposit is accepted.


    '
