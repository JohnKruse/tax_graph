  heading: Lines 2a and 2b
  context_heading: Additional Income and Adjustments to Income
  text: '## Lines 2a and 2b


    ### Alimony Received


    #### Line 2a


    Enter amounts received as alimony or separate maintenance pursuant to a divorce
    or separation agreement entered into on or before December 31, 2018, unless that
    agreement was changed after December 31, 2018, to expressly provide that alimony
    received isn''t included in your income. Alimony received is not included in your
    income if you entered into a divorce or separation agreement after December 31,
    2018. If you are including alimony in your income, you must let the person who
    made the payments know your social security num-


    ber. If you don''t, you may have to pay a penalty. For more details, see Pub.
    504.


    If you are including alimony payments from more than one divorce or separation
    agreement in your income, enter the total of all alimony received on line 2a.


    #### Line 2b


    On line 2b, enter the month and year of your original divorce or separation agreement
    that relates to the alimony payment, if any, reported on line 2a.


    If you have alimony payments from more than one divorce or separation agreement,
    on line 2b enter the month and year of the divorce or separation agreement for
    which you received the most income. Attach a statement listing the month and year
    of the other agreements.


    '
