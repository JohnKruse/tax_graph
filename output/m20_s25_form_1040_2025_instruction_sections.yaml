- section_id: instruction_section_instructions_form_1040_2025_0090
  document_id: schedule_1_2025
  line: 8z
  line_tokens:
  - 8z
  heading: Line 8z
  context_heading: Additional Income and Adjustments to Income
  text: '## Line 8z


    **Other income.** Use line 8z to report any taxable income not reported else-


    where on your return or other schedules. List the type and amount of income. If
    necessary, include a statement showing the required information. For more details,
    see *Miscellaneous Income* in Pub. 525.


    Examples of income to report on line 8z include the following.


    - Reimbursements or other amounts received for items deducted in an earlier year,
    such as medical expenses, real estate taxes, general sales taxes, or home mortgage
    interest. See *Recoveries* in Pub. 525 for details on how to figure the amount
    to report.


    - Reemployment trade adjustment assistance (RTAA) payments. These payments should
    be shown in box 5 of Form 1099-G.


    - Loss on certain corrective distributions of excess deferrals. See *Retirement
    Plan Contributions* in Pub. 525.


    - Dividends on insurance policies if they exceed the total of all net premiums
    you paid for the contract.


    - Recapture of a charitable contribution deduction relating to the contribution
    of a fractional interest in tangible personal property. See *Fractional Interest
    in Tangible Personal Property* in Pub. 526. Interest and an additional 10% tax
    apply to the amount of the recapture. See the instructions for Schedule 2, line
    17g.


    - Recapture of a charitable contribution deduction if the charitable organization
    disposes of the donated property within 3 years of the contribution. See *Recapture
    if no exempt use* in Pub. 526.


    - Taxable part of disaster relief payments. See Pub. 525 to figure the taxable
    part, if any. If any of your disaster relief payment is taxable, attach a statement
    showing the total payment received and how you figured the taxable part.


    - Taxable distributions from a Coverdell education savings account (ESA) or a
    qualified tuition program (QTP). Distributions from these accounts may be taxable
    if (a) in the case of distributions from a QTP, they are more than the qualified
    higher education expenses of the designated beneficiary in 2025 or, in the case
    of distributions from an ESA, they are more than the qualified education expenses
    of the designated beneficiary in 2025; and (b) they were not included in a qualified
    rollover. Nontaxa-


    92


    # Page 93

    ble distributions from these accounts don''t have to be reported on Form 1040
    or 1040-SR. This includes rollovers and qualified higher education expenses refunded
    to a student from a QTP that were recontributed to a QTP with the same designated
    beneficiary generally within 60 days after the date of refund. See Pub. 970.


    You may have to pay an additional tax if you received a taxable distribution from
    a Coverdell ESA or a QTP. See the Instructions for Form 5329.


    **Nontaxable income.** Don''t report any nontaxable income on line 8z. Examples
    of nontaxable income include the following.


    - Child support.

    - Life insurance proceeds received because of someone''s death (with some exceptions;
    any taxable amounts will generally be reported to you on Form 1099-R).


    - Gifts and bequests. You may have to report information on your gifts or bequests
    on Form 3520, Part IV, if you received:


    1. A gift or bequest from a foreign individual or foreign estate (including foreign
    persons related to that foreign individual or foreign estate) totaling more than
    $100,000; or


    2. Amounts totaling more than $20,116 from a foreign corporation or foreign partnership
    (including foreign persons related to such foreign corporations or foreign partnerships)
    that you treated as gifts.


    See the Instructions for Form 3520.


    '
