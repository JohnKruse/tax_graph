- section_id: instruction_section_instructions_form_1040_2025_0054
  document_id: form_1040_2025
  line: 35b
  line_tokens:
  - 35b
  heading: Line 35b
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '### Line 35b


    The routing number must be nine digits. The first two digits must be 01 through
    12 or 21 through 32. On the sample check shown later, the routing number is 250250025.
    Stella and Bailey Keys would use that routing number unless their financial institution
    instructed them to use a different routing number for direct deposits.


    Ask your financial institution for the correct routing number to enter on line
    35b if:


    -  The routing number on a deposit slip is different from the routing number on
    your checks,

    -  Your deposit is to a savings account that doesn''t allow you to write checks,
    or

    -  Your checks state they are payable through a financial institution different
    from the one at which you have your checking account.


    '
