    \ under Clergy, later, for how to determine the amount of your earned income.\n\
    \n### Line 27c\n\nCheck the box on line 27c if you do not want to claim the earned\
    \ income credit or if you have been instructed to check the box in the instructions\
    \ for line 27a.\n\n## Definitions and Special Rules\n\n**Adopted child.** An adopted\
    \ child is always treated as your own child. An adopted child includes a child\
    \ lawfully placed with you for legal adoption.\n\n**Church employees.** Determine\
    \ how much of the amount on Form 1040 or 1040-SR, line 1a, was also reported on\
    \ Schedule SE, Part I, line 5a. Subtract that amount from the amount on Form 1040\
    \ or 1040-SR, line 1a, and enter the result on line 1 of the worksheet in Step\
    \ 5 (instead of entering the actual amount from Form 1040 or 1040-SR, line 1a).\
    \ Be sure to answer \"Yes\" to question 2 in Step 5.\n\n**Clergy.** The following\
    \ instructions apply to ministers, members of religious orders who have not taken\
    \ a vow of poverty, and Christian Science practitioners. If you are filing Schedule\
    \ SE and the amount on line 2 of that schedule includes an amount that was also\
    \ reported on Form 1040 or 1040-SR, line 1z, do the following.\n\n1. Check the\
    \ box on line 27b.\n2. Determine how much of the amount on Form 1040 or 1040-SR,\
    \ line 1z, was also reported on Schedule SE, Part I, line 2.\n3. Subtract that\
    \ amount from the amount on Form 1040 or 1040-SR, line 1z. Enter the result on\
    \ line 1 of the worksheet in Step 5 (instead of entering the actual amount from\
    \ Form 1040 or 1040-SR, line 1z).\n4. Be sure to answer \"Yes\" to question 2\
    \ in Step 5.\n\n**Combat pay, nontaxable.** If you were a member of the U.S. Armed\
    \ Forces who served in a combat zone, certain pay is excluded from your income.\
    \ See Combat Zone Exclusion in Pub. 3. You can elect to include this pay in your\
    \ earned income when figuring the EIC. The amount of your nontaxable combat pay\
    \ should be shown in box 12 of Form(s) W-2 with code Q. If you are filing a joint\
    \ return and both you and your spouse received\n\nnontaxable combat pay, you can\
    \ each make your own election. In other words, if one of you makes the election,\
    \ the other one can also make it but doesn't have to.\n\nIf you elect to use your\
    \ nontaxable combat pay in figuring your EIC, enter that amount on line 1i.\n\n\
    **Credit figured by the IRS.** To have the IRS figure your EIC, do the following.\n\
    \n1. Enter \"EIC\" on the dotted line next to line 27a.\n2. Be sure you enter\
    \ the nontaxable combat pay you elect to include in earned income by entering\
    \ that amount on line 1i. See Combat pay, nontaxable, earlier.\n3. If you have\
    \ a qualifying child, complete and attach Schedule EIC. If your EIC for a year\
    \ after 1996 was reduced or disallowed, see Form 8862, who must file, later.\n\
    \n**Exception to time lived with you.** Temporary absences by you or the child\
    \ for special circumstances, such as school, vacation, business, medical care,\
    \ military service, or detention in a juvenile facility, count as time the child\
    \ lived with you. Also see Kidnapped child under Who Qualifies as Your Dependent,\
    \ earlier, and Members of the military, later. A child is considered to have lived\
    \ with you for more than half of 2025 if the child was born or died in 2025 and\
    \ your home was this child's home for more than half the time the child was alive\
    \ in 2025 or, if you adopted the child in 2025, the child was lawfully placed\
    \ with you for legal adoption by you in 2025, or if the child was an eligible\
    \ foster child placed with you during 2025 and your main home was the child's\
    \ main home for more than half the time since the child was adopted or placed\
    \ with you in 2025.\n\n**Form 4797 filers.** If the amount on Form 1040 or 1040-SR,\
    \ line 7a, includes an amount from Form 4797, you must use Worksheet 1 in Pub.\
    \ 596 to see if you can take the EIC. Otherwise, stop; you can't take the EIC.\n\
    \n**Form 8862, who must file.** You must file Form 8862 if your EIC for a year\
    \ after 1996 was reduced or disallowed for any reason other than a math or clerical\
    \ error. But don't file Form 8862 if either of the following applies.\n\n- You\
    \ filed Form 8862 for another year, the EIC was allowed for that year, and your\
    \ EIC hasn't been reduced or disallowed again for any reason other than a math\
    \ or clerical error.\n- You are taking the EIC without a qualifying child and\
    \ the only reason your EIC was reduced or disallowed in the other year was because\
    \ it was determined that a child listed on Schedule EIC wasn't your qualifying\
    \ child.\n\nAlso, don't file Form 8862 or take the credit for the:\n\n- 2 years\
    \ after the most recent tax year for which there was a final determination that\
    \ your EIC claim was due to reckless or intentional disregard of the EIC rules,\
    \ or\n- 10 years after the most recent tax year for which there was a final determination\
    \ that your EIC claim was due to fraud.\n\n**Foster child.** A foster child is\
    \ any child placed with you by an authorized placement agency or by judgment,\
    \ decree, or other order of any court of competent jurisdiction. For more details\
    \ on authorized placement agencies, see Pub. 596.\n\nNeed more information or\
    \ forms? Visit IRS.gov.\n\n43\n\n# Page 44\n**Full-time student.** A full-time\
    \ student is a child who during any part of 5 calendar months of 2025 was enrolled\
    \ as a full-time student at a school or took a full-time, on-farm training course\
    \ given by a school or a state, county, or local government agency. A school includes\
    \ a technical, trade, or mechanical school. It doesn't include an on-the-job training\
    \ course, correspondence school, or school offering courses only through the Internet.\n\
    \n**Main home.** Your main home may be your house, apartment, mobile home, shelter,\
    \ temporary lodging, or other location and doesn't need to be the same physical\
    \ location throughout 2025. You don't need a permanent address.\n\n**Married child.**\
    \ A child who was married at the end of 2025 is a qualifying child only if (a)\
    \ you can claim the child as your dependent, or (b) you could have claimed the\
    \ child as your dependent except for the special rule for *Children of divorced\
    \ or separated parents* under *Who Qualifies as Your Dependent*, earlier.\n\n\
    **Members of the military.** If you were on extended active duty outside the United\
    \ States, your main home is considered to be in the United States during that\
    \ duty period. Extended active duty is military duty ordered for an indefinite\
    \ period or for a period of more than 90 days. Once you begin serving extended\
    \ active duty, you are considered to be on extended active duty even if you don't\
    \ serve more than 90 days.\n\n**Nonresident aliens.** If you checked the box in\
    \ the *Filing Status* section to treat a nonresident alien or dual-status alien\
    \ spouse as a U.S. resident for the entire year, go to Step 2. Otherwise, stop;\
    \ you can't take the EIC. Check the box on line 27c. See *Nonresident aliens and\
    \ dual-status aliens*, earlier.\n\n**Permanently and totally disabled.** A person\
    \ is permanently and totally disabled if, at any time in 2025, the person couldn't\
    \ engage in any substantial gainful activity because of a physical or mental condition\
    \ and a doctor has determined that this condition (a) has lasted or can be expected\
    \ to last continuously for at least a year, or (b) can be expected to lead to\
    \ death.\n\n**Special rule for separated spouses.** If you are married, but not\
    \ filing a joint return, had a qualifying child who lived with you in the United\
    \ States for more than half of 2025, and either of the following apply, you can\
    \ claim the EIC if:\n\n- You lived apart from your spouse for the last 6 months\
    \ of 2025, or\n- You are legally separated according to your state law under a\
    \ written separation agreement or a decree of separate maintenance and you didn't\
    \ live in the same household as your spouse at the end of 2025.\n\nIf you meet\
    \ these requirements, make sure you check the box in the *Dependents* section\
    \ that discusses the special rule for separated spouses on page 1 of Form 1040\
    \ or 1040-SR.\n\n**Qualifying child of more than one person.** Even if a child\
    \ meets the conditions to be the qualifying child of more than one person, only\
    \ one person can claim the child as a qualifying child for all of the following\
    \ tax benefits, unless the special rule for *Children of divorced or separated\
    \ parents* under *Who Qualifies as Your Dependent*, earlier, applies.\n\n1. Child\
    \ tax credit, credit for other dependents, and additional child tax credit (lines\
    \ 19 and 28).\n2. Head of household filing status.\n3. Credit for child and dependent\
    \ care expenses (Schedule 3, line 2).\n4. Exclusion for dependent care benefits\
    \ (Form 2441, Part III).\n5. Earned income credit (line 27a).\n\nNo other person\
    \ can take any of the five tax benefits just listed based on the qualifying child.\
    \ If you and any other person can claim the child as a qualifying child, the following\
    \ rules apply. For purposes of these rules, the term \"parent\" means a biological\
    \ or adoptive parent of an individual. It doesn't include a step-parent or foster\
    \ parent unless that person has adopted the individual.\n\n- If only one of the\
    \ persons is the child's parent, the child is treated as the qualifying child\
    \ of the parent.\n- If the parents file a joint return together and can claim\
    \ the child as a qualifying child, the child is treated as the qualifying child\
    \ of the parents.\n- If the parents don't file a joint return together but both\
    \ parents claim the child as a qualifying child, the IRS will treat the child\
    \ as the qualifying child of the parent with whom the child lived for the longer\
    \ period of time in 2025. If the child lived with each parent for the same amount\
    \ of time, the IRS will treat the child as the qualifying child of the parent\
    \ who had the higher adjusted gross income (AGI) for 2025.\n- If no parent can\
    \ claim the child as a qualifying child, the child is treated as the qualifying\
    \ child of the person who had the highest AGI for 2025.\n- If a parent can claim\
    \ the child as a qualifying child but no parent does so claim the child, the child\
    \ is treated as the qualifying child of the person who had the highest AGI for\
    \ 2025, but only if that person's AGI is higher than the highest AGI of any parent\
    \ of the child who can claim the child.\n\nIf, under these rules, you can't claim\
    \ a child as a qualifying child for the EIC, you may be able to claim the EIC\
    \ under the rules for a taxpayer without a qualifying child. For more information,\
    \ see Pub. 596.\n\n**Example.** Your child, Lee, meets the conditions to be a\
    \ qualifying child for both you and your parent. Lee doesn't meet the conditions\
    \ to be a qualifying child of any other person, including Lee's other parent.\
    \ Under the rules just described, you can claim Lee as a qualifying child for\
    \ all of the five tax benefits listed here for which you otherwise qualify. Your\
    \ parent can't claim any of the five tax benefits listed here based on Lee. However,\
    \ if your parent's AGI is higher than yours and you don't claim Lee as a qualifying\
    \ child, Lee is the qualifying child of your parent.\n\nFor more details and examples,\
    \ see Pub. 596.\n\n**Social security number (SSN).** For the EIC, a valid SSN\
    \ is a number issued by the Social Security Administration unless \"Not Valid\
    \ for Employment\" is printed on the social security card and the number was issued\
    \ solely to allow the recipient of the SSN to apply for or receive a federally\
    \ funded benefit. If \"Not Valid for Employment\" is printed on the social security\n\
    \n44\n\nNeed more information or forms? Visit IRS.gov.\n\n# Page 45\ncard and\
    \ the cardholder's immigration status has changed so that they are now a U.S.\
    \ citizen or permanent resident, ask the SSA for a new social security card without\
    \ the legend. However, if 'Valid for Work Only With DHS Authorization' is printed\
    \ on your social security card, your SSN is valid for EIC purposes only as long\
    \ as the DHS authorization is still valid.\n\nTo find out how to get an SSN, see\
    \ *Social Security Number (SSN)* near the beginning of these instructions. If\
    \ you won't have an SSN by the date your return is due, see *What if You Can't\
    \ File on Time?*\n\nIf you didn't have an SSN issued on or before the due date\
    \ of your 2025 return (including extensions), you can't claim the EIC on your\
    \ original or an amended 2025 return. If a child didn't have an SSN issued on\
    \ or before the due date of your return (including extensions), you can't count\
    \ that child as a qualifying child in figuring the amount of the EIC on your original\
    \ or an amended 2025 return.\n\n**United States.** The United States means the\
    \ 50 states and the District of Columbia. It doesn't include Puerto Rico or U.S.\n\
    \nterritories. If you are a member of the military stationed outside the United\
    \ States, see *Members of the military*, earlier.\n\n**Welfare benefits, effect\
    \ of credit on.** Any refund you receive as a result of taking the EIC can't be\
    \ counted as income when determining if you or anyone else is eligible for benefits\
    \ or assistance, or how much you or anyone else can receive, under any federal\
    \ program or under any state or local program financed in whole or in part with\
    \ federal funds. These programs include Temporary Assistance for Needy Families\
    \ (TANF), Medicaid, Supplemental Security Income (SSI), and Supplemental Nutrition\
    \ Assistance Program (formerly food stamps). In addition, when determining eligibility,\
    \ the refund can't be counted as a resource for at least 12 months after you receive\
    \ it. Check with your local benefit coordinator to find out if your refund will\
    \ affect your benefits.\n\n*Need more information or forms? Visit IRS.gov.*\n\n\
