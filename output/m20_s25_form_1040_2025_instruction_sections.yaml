  heading: Lines 13a Through 13z Other Payments or Refundable Credits
  context_heading: Instructions for Schedule 3
  text: '## Lines 13a Through 13z Other Payments or Refundable Credits


    ### Line 13b


    If you are claiming a credit for repayment of amounts you included in your income
    in an earlier year because it appeared you had a right to the income, enter the
    amount on line 13b. See Pub. 525 for details about this credit.


    ### Line 13c


    Enter any net elective payment election amount from Form 3800, Part III, line
    6, column (j).


    ### Line 13d


    If you elected to pay your net 965 tax liability in installments, report the deferred
    amount on line 13d. Enter the amount of net 965 tax liability remaining to be
    paid in future years.


    ### Line 13z


    **Other refundable credits.** Use line 13z to report the credit under section
    960(c) with respect to an excess limitation account. If an increase in the limitation
    under section 960(c) is more than your U.S. income tax reported on Form 1116,
    Part III, line 20, the amount of the excess is deemed an overpayment of tax and
    can be claimed on line 13z as a refundable credit. See section 960(c)(5). Enter
    ''960(c)'' and the amount of the credit. See section 960(c) for more information
    about the circumstances under which an excess in limitation arises. Also, see
    the instructions for Form 1116, Part III, line 22, for your increase in limitation.


    Also use line 13z to report the amount of U.S. tax allocable to the U.S. Virgin
    Islands. Enter ''Form 8689'' and the amount paid.


    If you made the election to defer net income tax attributable to the gain on the
    sale or exchange of qualified farmland property, use Form 1062 to figure the amount
    of your applicable net tax liability. On line 13z, enter 75% of your applicable
    net tax liability from Form 1062, line 14. Identify as ''1062NL.''


    117


    # Page 118

    '
