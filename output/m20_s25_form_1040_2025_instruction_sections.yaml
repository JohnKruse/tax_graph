  text: '## Line 21


    ### Student Loan Interest Deduction


    You can take this deduction only if all of the following apply.


    - You paid interest in 2025 on a qualified student loan (defined later).

    - Your filing status is any status except married filing separately.

    - Your modified adjusted gross income (AGI) is less than $100,000 if single, head
    of household, or qualifying


    surviving spouse; $200,000 if married filing jointly. Use lines 2 through 4 of
    the worksheet in these instructions to figure your modified AGI.


    - You, or your spouse if filing jointly, aren''t claimed as a dependent on someone
    else''s (such as your parent''s) 2025 tax return.


    Don''t include any amount paid from a distribution of earnings made from a qualified
    tuition program (QTP) after 2018 to the extent the earnings are treated as tax
    free because they were used to pay student loan interest.


    Use the worksheet in these instructions to figure your student loan interest deduction.


    **Exception.** Use Pub. 970 instead of the worksheet in these instructions to
    figure your student loan interest deduction if you file Form 2555 or 4563, or
    you exclude income from sources within Puerto Rico.


    **Qualified student loan.** A qualified student loan is any loan you took out
    to pay the qualified higher education expenses for any of the following individuals
    who were eligible students.


    1. Yourself or your spouse.


    98


    # Page 99

    '
