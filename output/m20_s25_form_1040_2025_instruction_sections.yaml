    from that corporation.


    tion. See Pub. 560 or, if you were a minister, Pub. 517.


    ## Line 17


    ### Self-Employed Health Insurance Deduction


    You may be able to deduct the amount you paid for health insurance (which includes
    medical, dental, and vision insurance and qualified long-term care insurance)
    for yourself, your spouse, and your dependents. The insurance can also cover your
    child who was under age 27 at the end of 2025, even if the child wasn''t your
    dependent. A child includes your son, daughter, stepchild, adopted child, or foster
    child (defined in *Who Qualifies as Your Dependent* in the Instructions for Form
    1040).


    One of the following statements must be true.


    - You were self-employed and had a net profit for the year reported on Schedule
    C or F.

    - You were a partner with net earnings from self-employment.

    - You used one of the optional methods to figure your net earnings from self-employment
    on Schedule SE.

    - You received wages in 2025 from an S corporation in which you were a


    more-than-2% shareholder. Health insurance premiums paid or reimbursed by the
    S corporation are shown as wages on Form W-2.


    The insurance plan must be established under your business. Your personal services
    must have been a material income-producing factor in the business. If you are
    filing Schedule C or F, the policy can be either in your name or in the name of
    the business.


    If you are a partner, the policy can be either in your name or in the name of
    the partnership. You can either pay the premiums yourself or your partnership
    can pay them and report them as guaranteed payments. If the policy is in your
    name and you pay the premiums yourself, the partnership must reimburse you and
    report the premiums as guaranteed payments.


    If you are a more-than-2% shareholder in an S corporation, the policy can be either
    in your name or in the name of the S corporation. You can either pay the premiums
    yourself or the S corporation can pay them and report them as wages. If the policy
    is in your name and you pay the premiums yourself, the S corporation must reimburse
    you. You can deduct the premiums only if the S corporation reports the premiums
    paid or reim-


    bursed as wages in box 1 of your Form W-2 in 2025 and you also report the premium
    payments or reimbursements as wages on Form 1040 or 1040-SR, line 1a.


    But if you were also eligible to participate in any subsidized health plan maintained
    by your or your spouse''s employer for any month or part of a month in 2025, amounts
    paid for health insurance coverage for that month can''t be used to figure the
    deduction. Also, if you were eligible for any month or part of a month to participate
    in any subsidized health plan maintained by the employer of either your dependent
    or your child who was under age 27 at the end of 2025, don''t use amounts paid
    for coverage for that month to figure the deduction.


    **CAUTION** A qualified small employer health reimbursement arrangement (QSEHRA)
    is considered to be a subsidized health plan maintained by an employer.


    **Example.** If you were eligible to participate in a subsidized health plan maintained
    by your spouse''s employer from September 30 through December 31, you can''t use
    amounts paid for health insurance coverage for September through December to figure
    your deduction.


    94


    # Page 95

    Medicare premiums you voluntarily pay to obtain insurance in your name that is
    similar to qualifying private health insurance can be used to figure the deduction.
    Amounts paid for health insurance coverage from retirement plan distributions
    that were nontaxable because you are a retired public safety officer can''t be
    used to figure the deduction.


    For more details, see Instructions for Form 7206.


    If you qualify to take the deduction, use the Self-Employed Health Insurance Deduction
    Worksheet to figure the amount you can deduct.


    **Exceptions.** Use Form 7206 instead of the Self-Employed Health Insurance Deduction
    Worksheet in these instructions to figure your deduction if any of the following
    applies.


    - You had more than one source of income subject to self-employment tax.

    - You file Form 2555.

    - You are using amounts paid for qualified long-term care insurance to figure
    the deduction.


    Use Pub. 974 instead of the worksheet in these instructions if the insurance plan
    was considered to be established under your business and was obtained through
    the Marketplace, and advance payments of the premium tax credit were made or you
    are claiming the premium tax credit.


    ## Line 18


    ### Penalty on Early Withdrawal of Savings


    The Form 1099-INT or Form 1099-OID you received will show the amount of any penalty
    you were charged.


    ## Lines 19a, 19b, and 19c


    ### Alimony Paid


    #### Line 19a


    If you made payments to or for your spouse or former spouse under a divorce or
    separation agreement entered into on or before December 31, 2018, you may be able
    to take this deduction. You can''t take a deduction for alimony payments you made
    to or for your spouse if you


    entered into your divorce or separation agreement after December 31, 2018, or
    if you entered into the agreement on or before December 31, 2018, and the agreement
    was changed after December 31, 2018, to expressly provide that alimony received
    is not included in your former spouse''s income. Use *Tax Topic 452* or see Pub.
    504.


    #### Line 19c


    On line 19c, enter the month and year of your original divorce or separation agreement
    that relates to this deduction for alimony paid.


    ## Line 20


    ### IRA Deduction


    **TIP** *If you made any nondeductible contributions to a traditional individual
    retirement arrangement (IRA) for 2025, you must report them on Form 8606.*


    **TIP** *You are entitled to a deduction for your contribution to a traditional
    IRA regardless of age.*


    If you made contributions to a traditional IRA for 2025, you may be able to take
    an IRA deduction. But you, or your spouse if filing a joint return, must have
    had earned income to do so. For IRA purposes, earned income includes alimony and
    separate maintenance payments reported on Schedule 1, line 2a. If you were a member
    of the U.S. Armed Forces, earned income includes any nontaxable combat pay you
    received. If you were self-employed, earned income is generally your net earnings
    from self-employment if your personal services were a material income-producing
    factor. For more details, see Pub. 590-A. A statement should be sent to you by
    June 1, 2026, that shows all contributions to your traditional IRA for 2025.


    Use the IRA Deduction Worksheet to figure the amount, if any, of your IRA deduction.
    But read the following list before you fill in the worksheet.


    1. You can''t deduct contributions to a Roth IRA. But you may be able to take
    the retirement savings contributions credit (saver''s credit). See the instructions
    for Schedule 3, line 4.


    2. If you are filing a joint return and you or your spouse made contributions
    to both a traditional IRA and a Roth IRA for 2025, don''t use the IRA Deduction
    Worksheet in these instructions. Instead, see Pub. 590-A to figure the amount,
    if any, of your IRA deduction.


    3. You can''t deduct elective deferrals to a 401(k) plan, 403(b) plan, section
    457 plan, SIMPLE IRA plan, or the federal Thrift Savings Plan. Except for designated
    Roth contributions, these amounts aren''t included as income in box 1 of your
    Form W-2.


    4. If you made contributions to your IRA in 2025 that you deducted for 2024, don''t
    include them in the worksheet.


    5. If you received income from a nonqualified deferred compensation plan or nongovernmental
    section 457 plan that is included in box 1 of your Form W-2, or in box 1 of Form
    1099-NEC, don''t include that income on line 8 of the worksheet. The income should
    be shown in (a) box 11 of your Form W-2, (b) box 12 of your Form W-2 with code
    Z, or (c) box 15 of Form 1099-MISC. If it isn''t, contact your employer or the
    payer for the amount of the income.


    6. You must file a joint return to deduct contributions to your spouse''s IRA.
    Enter the total IRA deduction for you and your spouse on line 20.


    7. Don''t include rollover contributions in figuring your deduction. Instead,
    see the instructions for Form 1040 or 1040-SR, lines 4a and 4b.


    8. Don''t include trustees'' fees that were billed separately and paid by you
    for your IRA.


    9. Don''t include any repayments of qualified reservist distributions. You can''t
    deduct them. For information on how to report these repayments, see *Qualified
    reservist repayments* in Pub. 590-A.


    10. If the total of your IRA deduction on line 20 plus any nondeductible contributions
    to your traditional IRAs shown on Form 8606 is less than your total traditional
    IRA contributions for 2025, see Pub. 590-A for special rules.


    **Were You Covered by a Retirement Plan?** If you were covered by a retirement
    plan (qualified pension,


    95


    # Page 96

    profit-sharing (including 401(k)), annuity, SEP, SIMPLE, etc.) at work or through
    self-employment, your IRA deduction may be reduced or eliminated. But you can
    still make contributions to an IRA even if you can''t deduct them. In any case,
    the income earned on your IRA contributions isn''t taxed until it is paid to you.


    The ''Retirement plan'' box in box 13 of your Form W-2 should be checked if you
    were covered by a plan at work even if you weren''t vested in the plan. You are
    also covered by a plan if you


    were self-employed and had a SEP, SIMPLE, or qualified retirement plan.


    If you were covered by a retirement plan and you file Form 2555 or 8815, or you
    exclude employer-provided adoption benefits, see Pub. 590-A to figure the amount,
    if any, of your IRA deduction.


    *Married persons filing separately.* If you weren''t covered by a retirement plan
    but your spouse was, you are considered covered by a plan unless you


    lived apart from your spouse for all of 2025.


    If you are married filing separately and you lived apart from your spouse for
    all of 2025, check the box on line 20. If you don''t check the box on line 20,
    you may get a math error notice from the IRS.


    *You may be able to take the retirement savings contributions credit. See the
    Schedule 3, line 4, instructions.*


    96


    # Page 97

    '
