  heading: Lines 19a, 19b, and 19c
  context_heading: Additional Income and Adjustments to Income
  text: '## Lines 19a, 19b, and 19c


    ### Alimony Paid


    #### Line 19a


    If you made payments to or for your spouse or former spouse under a divorce or
    separation agreement entered into on or before December 31, 2018, you may be able
    to take this deduction. You can''t take a deduction for alimony payments you made
    to or for your spouse if you


    entered into your divorce or separation agreement after December 31, 2018, or
    if you entered into the agreement on or before December 31, 2018, and the agreement
    was changed after December 31, 2018, to expressly provide that alimony received
    is not included in your former spouse''s income. Use *Tax Topic 452* or see Pub.
    504.


    #### Line 19c


    On line 19c, enter the month and year of your original divorce or separation agreement
    that relates to this deduction for alimony paid.


    '
