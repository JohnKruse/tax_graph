    ### Student Loan Interest Deduction\n\nYou can take this deduction only if all\
    \ of the following apply.\n\n- You paid interest in 2025 on a qualified student\
    \ loan (defined later).\n- Your filing status is any status except married filing\
    \ separately.\n- Your modified adjusted gross income (AGI) is less than $100,000\
    \ if single, head of household, or qualifying\n\nsurviving spouse; $200,000 if\
    \ married filing jointly. Use lines 2 through 4 of the worksheet in these instructions\
    \ to figure your modified AGI.\n\n- You, or your spouse if filing jointly, aren't\
    \ claimed as a dependent on someone else's (such as your parent's) 2025 tax return.\n\
    \nDon't include any amount paid from a distribution of earnings made from a qualified\
    \ tuition program (QTP) after 2018 to the extent the earnings are treated as tax\
    \ free because they were used to pay student loan interest.\n\nUse the worksheet\
    \ in these instructions to figure your student loan interest deduction.\n\n**Exception.**\
    \ Use Pub. 970 instead of the worksheet in these instructions to figure your student\
    \ loan interest deduction if you file Form 2555 or 4563, or you exclude income\
    \ from sources within Puerto Rico.\n\n**Qualified student loan.** A qualified\
    \ student loan is any loan you took out to pay the qualified higher education\
    \ expenses for any of the following individuals who were eligible students.\n\n\
    1. Yourself or your spouse.\n\n98\n\n# Page 99\n## Student Loan Interest Deduction\
    \ WorksheetSchedule 1, Line 21\n\n**Before you begin:**  If the instructions for\
    \ Schedule 1, line 24z, have you enter a write-in adjustment on line 24z, figure\
    \ that write-in before completing this worksheet (see the instructions for Schedule\
    \ 1, line 24z).\n Be sure you have read the **Exception** in the instructions\
    \ for this line to see if you can use this worksheet instead of Pub. 970 to figure\
    \ your deduction.\n\n|  1. Enter the total interest you paid in 2025 on qualified\
    \ student loans (see the instructions for line 21). **Don't** enter more than\
    \ $2,500 | 1.  |\n| --- | --- |\n|  2. Enter the amount from Form 1040 or 1040-SR,\
    \ line 9 | 2.  |\n|  3. Enter the total of the amounts from Schedule 1, lines\
    \ 11 through 20, and 23 and 25 | 3.  |\n|  4. Subtract line 3 from line 2 | 4.\
    \  |\n|  5. Enter the amount shown below for your filing status.  Single, head\
    \ of household, or qualifying surviving spouse$85,000  Married filing jointly$170,000\
    \ | 5.  |\n|  6. Is the amount on line 4 more than the amount on line 5?  No.\
    \ Skip lines 6 and 7, enter -0- on line 8, and go to line 9.  Yes. Subtract line\
    \ 5 from line 4 | 6.  |\n|  7. Divide line 6 by $15,000 ($30,000 if married filing\
    \ jointly). Enter the result as a decimal (rounded to at least three places).\
    \ If the result is 1.000 or more, enter 1.000 | 7.  |\n|  8. Multiply line 1 by\
    \ line 7 | 8.  |\n|  9. **Student loan interest deduction.** Subtract line 8 from\
    \ line 1. Enter the result here and on Schedule 1, line 21. **Don't** include\
    \ this amount in figuring any other deduction on your return (such as on Schedule\
    \ A, C, E, etc.) | 9.  |\n\n2. Any person who was your dependent when the loan\
    \ was taken out.\n\n3. Any person you could have claimed as a dependent for the\
    \ year the loan was taken out except that:\n\n- a. The person filed a joint return;\n\
    - b. The person had gross income that was equal to or more than the exemption\
    \ amount for that year or $5,200 for 2025; or\n- c. You, or your spouse if filing\
    \ jointly, could be claimed as a dependent on someone else's return.\n\nHowever,\
    \ a loan isn't a qualified student loan if (a) any of the proceeds were used for\
    \ other purposes, or (b) the loan was from either a related person or a person\
    \ who borrowed the proceeds under a qualified employer plan or a contract purchased\
    \ under such a plan. For details, see Pub. 970.\n\n**Qualified higher education\
    \ expenses.** Qualified higher education expenses generally include tuition, fees,\
    \ room and board, and related expenses such as\n\nbooks and supplies. The expenses\
    \ must be for education in a degree, certificate, or similar program at an eligible\
    \ educational institution. An eligible educational institution includes most colleges,\
    \ universities, and certain vocational schools. For details, see Pub. 970.\n\n\
    ### Line 22\n\nLine 22 has been reserved for future use.\n\n### Line 23\n\n####\
    \ Archer MSA Deduction\n\nSee Form 8853.\n\n#### Lines 24a Through 24z\n\n#####\
    \ Line 24a\n\n**Jury duty pay.** Enter your jury duty pay if you gave the pay\
    \ to your employer because your employer paid your salary while you served on\
    \ the jury.\n\n##### Line 24b\n\nEnter the deductible expenses related to income\
    \ reported on line 81 from the rental of personal property you engaged in for\
    \ profit but were not in the business of renting such property.\n\n##### Line\
    \ 24c\n\nEnter the nontaxable amount of the value of Olympic and Paralympic medals\
    \ and USOC prize money reported on line 8m.\n\n##### Line 24d\n\nEnter reforestation\
    \ amortization and expenses (see the Instructions for Form 4562).\n\n##### Line\
    \ 24e\n\nEnter repayment of supplemental unemployment benefits under the Trade\
    \ Act of 1974 (see Pub. 525).\n\n99\n\n# Page 100\n"
