  text: '## Self-Employed Health Insurance Deduction WorksheetSchedule 1, Line 17


    **Before you begin:**  Be sure you have read the **Exceptions** in the instructions
    for this line to see if you can use this worksheet instead of Form 7206 to figure
    your deduction.


    |  1. Enter the total amount paid in 2025 for health insurance coverage established
    under your business (or the S corporation in which you were a more-than-2% shareholder)
    for 2025 for you, your spouse, and your dependents. Your insurance can also cover
    your child who was under age 27 at the end of 2025, even if the child wasn''t
    your dependent. But don''t include amounts for any month you were eligible to
    participate in an employer-sponsored health plan or amounts paid from retirement
    plan distributions that were nontaxable because you are a retired public safety
    officer ... | 1. | _____  |

    | --- | --- | --- |

    |  2. Enter your net profit* and any other earned income** from the business under
    which the insurance plan is established, minus any deductions on Schedule 1, lines
    15 and 16. Don''t include Conservation Reserve Program payments exempt from self-employment
    tax ... | 2. | _____  |

    |  3. **Self-employed health insurance deduction.** Enter the **smaller** of line
    1 or line 2 here and on Schedule 1, line 17. **Don''t** include this amount in
    figuring any medical expense deduction on Schedule A ... | 3. | _____  |


    *If you used either optional method to figure your net earnings from self-employment,
    don''t enter your net profit. Instead, enter the amount from Schedule SE, line
    4b.


    **Earned income includes net earnings and gains from the sale, transfer, or licensing
    of property you created. However, it doesn''t include capital gain income. If
    you were a more-than-2% shareholder in the S corporation under which the insurance
    plan is established, earned income is your Medicare wages (box 5 of Form W-2)
    from that corporation.


    tion. See Pub. 560 or, if you were a minister, Pub. 517.


