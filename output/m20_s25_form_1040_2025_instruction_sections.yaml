  line_tokens:
  - 12e
  heading: Line 12e
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 12e

    Standard Deduction or Itemized Deductions


    If you are filing Form 1040-SR, you can find a Standard Deduction Chart on the
    last page of that form. Don''t file the Standard Deduction Chart with your return.


    In most cases, your federal income tax will be less if you take the larger of
    your standard deduction or itemized deductions.


    ### Standard Deduction


    Most Form 1040 filers can find their standard deduction by looking at the amounts
    listed to the left of line 12e. Most Form 1040-SR filers can find their standard
    deduction by using the chart on the last page of Form 1040-SR.


    **Exception 1Dependent. Line 12a.** If you checked a box on line 12a, use the
    Standard Deduction Worksheet for Dependents to figure your standard deduction.


    Someone claims you or your spouse as a dependent if they list your or your spouse''s
    name and SSN in the Dependents section of their return.


    **Exception 2Spouse itemizes on a separate return. Line 12b.** If you checked
    the box on line 12b, your standard deduction is zero, even if you were born before
    January 2, 1961, or were blind.


    **Exception 3Dual-status alien. Line 12c.** If you checked the box on line 12c,
    your standard deduction is zero, even if you were born before January 2, 1961,
    or were blind.


    **Exception 4Born before January 2, 1961, or blind. Line 12d.** If you checked
    any box on line 12d, figure your standard deduction by using the Standard Deduction
    Chart for People Who Were Born Before January 2, 1961, or Were Blind if you are
    filing Form 1040 or by using the chart on the last page of Form 1040-SR.


    **Exception 5Increased standard deduction for net qualified disaster loss.** If
    you had a net qualified disaster loss and you elect to increase your standard
    deduction by the amount of your net qualified disaster loss, use Schedule A to
    figure your standard deduction. Qualified disaster loss refers to losses arising
    from certain disasters occurring in 2016 and subsequent years. See the Instructions
    for Form 4684 and Schedule A, line 16, for more information.


    ### Itemized Deductions


    To figure your itemized deductions, fill in Schedule A.


    If you made a section 962 election and are taking a deduction under section 250
    with respect to any income inclusions under section 951A, don''t report the deduction
    on line 12e. Instead, report the tax with respect to a section 962 election on
    line 16 and include in the statement required by line 16 how you figured the section
    250 deduction.


    '
