- section_id: instruction_section_instructions_form_1040_2025_0003
  document_id: form_1040_2025
  line: 1c
  line_tokens:
  - 1c
  heading: Line 1c
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 1c


    ### Tip Income Not Reported on Line 1a


    Enter the total of your tip income that was not reported on Form 1040, line 1a.
    This should include any tip income you didn''t report to your employer and any
    allocated tips shown in box 8 on your Form(s) W-2 unless you can prove that your
    unreported tips are less than the amount in box 8. Allocated tips aren''t included
    as income in box 1. See Pub. 531 for more details. Also, include the value of
    any noncash tips you received, such as tickets, passes, or other items of value.
    Although you don''t report these noncash tips to your employer, you must report
    them on line 1c.


    *You may owe social security and Medicare or railroad retirement (RRTA) tax on
    unreported tips. See the instructions for Schedule 2, line 5.*


    '
