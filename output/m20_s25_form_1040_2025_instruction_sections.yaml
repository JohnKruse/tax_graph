- section_id: instruction_section_instructions_form_1040_2025_0052
  document_id: form_1040_2025
  line: '34'
  line_tokens:
  - '34'
  heading: Line 34
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '### Line 34


    #### Amount Overpaid


    If line 34 is under $1, we will send a refund only on written request.


    #### Refund Offset


    If you owe past-due federal tax, state income tax, state unemployment compensation
    debts, child support, spousal support, or certain federal nontax debts, such as
    student loans, all or part of the overpayment on line 34 may be used (offset)
    to pay the past-due amount. Offsets for federal taxes are made by the IRS. All
    other offsets are made by the Treasury Department''s Bureau of the Fiscal Service.
    For federal tax offsets, you will receive a notice from the IRS. For all other
    offsets, you will receive a notice from the Fiscal Service. To find out if you
    may have an offset or if you have any questions about it, contact the agency to
    which you owe the debt.


    #### Deposit Refund Into Multiple Accounts


    If you want your refund to be split and direct deposited into more than one account,
    file Form 8888. Use Form 8888 to direct deposit your refund (or part of it) to
    one or more accounts in your name at a bank or other financial institution (such
    as a mutual fund, brokerage firm, or credit union) in the United States.


    Need more information or forms? Visit IRS.gov.


    61


    # Page 62

    '
