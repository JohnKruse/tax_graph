    1. Amounts from Form 4255, column (j), lines 1b, 1j, 1l, and 1m. Identify as "3468."

    2. Non-EPE recapture applied against tax from Form 3468, Part IV, reported on
    Form 4255, line 1d, column (j). Identify as "NEPE3468."

    3. New markets credit (see Form 8874). Identify as "NMCR."

    4. Credit for employer-provided childcare facilities (see Form 8882). Identify
    as "ECCFR."

    5. Any section 6418(g)(3) amounts attributable to recapture from Form 4255, column
    (m)(3). Identify as "6418(g)(3)."


    **Line 17b.** If you sold your home in 2025 and it was financed (in whole or in
    part) from the proceeds of any tax-exempt qualified mortgage bond or you claimed
    the mortgage interest credit, you may owe a recapture tax on the mortgage subsidy.
    See Form 8828.


    **Line 17c.** Enter any additional tax on health savings account (HSA) distributions
    you received from Form 8889, line 17b. See Form 8889, Part II.


    **Line 17d.** Enter any additional tax for failure to remain an eligible individual
    during the testing period from Form 8889, line 21. See Form 8889, Part III.


    **Line 17e.** Enter any additional tax on Archer MSA distributions from Form 8853,
    line 9b. See Form 8853.


    **Line 17f.** Enter any additional tax on Medicare Advantage MSA distributions
    from Form 8853, line 13b. See Form 8853.


    **Line 17g.** Enter any additional tax on recapture of a charitable contribution
    deduction relating to a fractional interest in


    113


    # Page 114

    tangible personal property. See Pub. 526 for more information.


    **Line 17h.** Enter any additional tax on income you received from a nonqualified
    deferred compensation plan that fails to meet the requirements of section 409A.
    This income should be shown in box 12 of Form W-2 with code Z, or in box 15 of
    Form 1099-MISC. The tax is 20% of the amount required to be included in income
    plus an interest amount determined under section 409A(a)(1)(B) (ii). See section
    409A(a)(1)(B) for details.


    **Line 17i.** Enter any additional tax on compensation you received from a nonqualified
    deferred compensation plan described in section 457A if the compensation would
    have been includable in your income in an earlier year except that the amount
    wasn''t determinable until 2025. The tax is 20% of the amount required to be included
    in income plus an interest amount determined under section 457A(c)(2). See section
    457A for details.


    **Line 17j.** Enter any section 72(m)(5) excess benefits tax. See Pub. 560 for
    more information.


    **Line 17k.** If you received an excess parachute payment (EPP), you must pay
    a 20% tax on it. This tax should be shown in box 12 of Form W-2 with code K. If
    you received a Form 1099-NEC, the tax is 20% of the EPP shown in box 3. Enter
    this amount on line 17k.


    **Line 17l.** Enter any tax on accumulation distribution of trusts. See Form 4970
