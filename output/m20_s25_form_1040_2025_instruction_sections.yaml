  heading: Line 1b
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 1b


    ### Household Employee Wages Not Reported on Form(s) W-2


    Enter the total of your wages received as a household employee that was not reported
    on Form(s) W-2. An employer isn''t required to provide a Form W-2 to you if they
    paid you wages of less than $2,800 in 2025. For information on employment taxes
    for household employees, see *Tax Topic 756*.


    '
