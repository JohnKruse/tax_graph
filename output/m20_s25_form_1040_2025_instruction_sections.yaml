  heading: Line 35d
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '### Line 35d


    The account number can be up to 17 characters (both numbers and letters). Include
    hyphens but omit spaces and special symbols. Enter the number from left to right
    and leave any unused boxes blank. On the sample check shown later,


    ![img-5.jpeg](img-5.jpeg)


    *The routing and account numbers may be in different places on your check.*


    the account number is 20202086. Don''t include the check number.


    If the direct deposit to your account(s) is different from the amount you expected,
    you will receive an explanation in the mail about 2 weeks after your refund is
    deposited.


    '
