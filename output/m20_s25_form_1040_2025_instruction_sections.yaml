  heading: Line 1f
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 1f


    ### Employer-Provided Adoption Benefits From Form 8839, Line 31


    Enter the total of your employer-provided adoption benefits from Form 8839, line
    31. Employer-provided adoption benefits should be shown in box 12 of your Form(s)
    W-2 with code T. But see the Instructions for Form 8839 to find out if you can
    exclude part or all of the benefits. You may also be able to exclude amounts if
    you adopted a child with special needs and the adoption became final in 2025.


    '
