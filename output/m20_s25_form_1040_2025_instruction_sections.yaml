- section_id: instruction_section_instructions_form_1040_2025_0014
  document_id: form_1040_2025
  line: 2a
  line_tokens:
  - 2a
  heading: Line 2a
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 2a


    ### Tax-Exempt Interest


    If you received any tax-exempt interest (including any tax-exempt original issue
    discount (OID)), such as from municipal bonds, each payer should send you a Form
    1099-INT or a Form 1099-OID. In general, your tax-exempt stated interest should
    be shown in box 8 of Form 1099-INT or, for a tax-exempt OID bond, in box 2 of
    Form 1099-OID, and your tax-exempt OID should be shown in box 11 of Form 1099-OID.
    Enter the total on line 2a. However, if you acquired a tax-exempt bond at a premium,
    only report the net amount of tax-exempt interest on line 2a (that is, the excess
    of the tax-exempt interest received during the year over the amortized bond premium
    for the year). Also, if you acquired a tax-exempt OID bond at an acquisition premium,
    only report the net amount of tax-exempt OID on line 2a (that is, the excess of
    tax-exempt OID for the year over the amortized acquisition premium for the year).
    See Pub. 550 for more information about OID, bond premium, and acquisition premium.


    Also include on line 2a any exempt-interest dividends from a mutual fund or other
    regulated investment company. This amount should be shown in box 12 of Form 1099-DIV.


    Don''t include interest earned on your IRA, health savings account, Archer or
    Medicare Advantage MSA, or Coverdell education savings account.


    Don''t include any amounts related to the forgiveness of PPP Loans on this line.


    '
