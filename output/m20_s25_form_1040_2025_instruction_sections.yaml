  heading: Line 7a
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 7a


    ### Capital Gain or (Loss)


    If you sold a capital asset, such as a stock, bond, or digital asset, you must
    complete and attach Form 8949 and Schedule D.


    **Exception 1.** You don''t have to file Form 8949 or Schedule D if you aren''t
    deferring any capital gain by investing in a qualified opportunity fund and both
    of the following apply.


    1. You have no capital losses, and your only capital gains are capital gain distributions
    from Form(s) 1099-DIV, box 2a (or substitute statements); and


    2. None of the Form(s) 1099-DIV (or substitute statements) have an amount in box
