  heading: Lines 1a Through 1z
  context_heading: Instructions for Schedule 2
  text: '#### Lines 1a Through 1z


    ##### Additions to Tax


    **Line 1a. Excess advance premium tax credit repayment.** The premium tax credit
    helps pay premiums for health insurance purchased from the Marketplace. Eligible
    individuals may have advance payments of the premium tax credit paid on their
    behalf directly to the insurance company. If you, your spouse with whom you are
    filing a joint return, or your dependent was enrolled in coverage purchased from
    the Marketplace and advance payments of the premium tax credit were made for the
    coverage, complete Form 8962 to reconcile (compare) the advance payments with
    your premium tax credit. You (or whoever enrolled you) should have received Form
    1095-A from the Marketplace with information about your coverage and any advance
    credit payments. If the advance credit payments were more than the premium tax
    credit you can claim, the amount you must repay will be shown on Form 8962, line
    29. Enter that amount, if any, on line 1a.


    You may have to repay excess advance payments of the premium tax credit even if
    someone else enrolled you, your spouse, or your dependent in Marketplace coverage.
    In that case, another individual may have received the


    Form 1095-A for the coverage. You may also have to repay excess advance payments
    of the premium tax credit if you enrolled an individual in coverage through the
    Marketplace, you don''t claim the individual as a dependent on your return, and
    no one else claims that individual as a dependent. For more information, see the
    Instructions for Form 8962.


    **Line 1b. Repayment of new clean vehicle credit(s) from Schedule A (Form 8936),
    Part II.** If you purchased a new clean vehicle from a registered dealer and reduced
    the amount you paid at the time of sale by transferring the credit to the dealer,
    you may have to repay the amount of the credit you transferred if you no longer
    qualify. If you completed Schedule A (Form 8936), Part II, and you:


    -  Checked the "Yes" box on Part II, line 8a or 8d; and

    -  Checked the "Yes" box on Part I, line 4a; then,

    enter the amount from Part I, line 4a, on Schedule 2, line 1b.


    If you completed more than one Schedule A (Form 8936), Part II, and you need to
    report an amount from more than one Schedule A (Form 8936), Part II, enter the
    total of those amounts on line 1b.


    **Line 1c. Repayment of previously owned clean vehicle credit(s) from Schedule
    A (Form 8936), Part IV.** If you purchased a previously owned clean vehicle from
    a registered dealer and reduced the amount you paid at the time of sale by transferring
    the credit to the dealer, you may have to repay the amount of the credit you transferred
    if you no longer qualify. If you completed Schedule A (Form 8936), Part IV, and
    you:


    -  Checked the "Yes" box on Part IV, line 13a or 13c; and

    -  Checked the "Yes" box on Part I, line 4a; then,

    enter the amount from Part I, line 4a, on Schedule 2, line 1c.


    If you completed more than one Schedule A (Form 8936), Part IV, and you need to
    report an amount from more than one Schedule A (Form 8936), Part IV, enter the
    total of those amounts on line 1c.


    **Line 1d. Recapture of net EPE.** Enter any amount of net elective payment election
    (EPE) recapture from Form 4255, line 2a, column (l).


    **Line 1e. Excessive payments (EPs) on gross EPE from Form 4255.** If you reported
    an amount on Form 4255, column (n)(1), on line 1a, 1c, 1d, and/or 2a, check the
    applicable box and enter the amount on line 1e. If you checked more than one box,
    enter the total amount on line 1e.


    **Line 1f. 20% EP from Form 4255.** If you reported an amount on Form 4255, column
    (n)(3), line 1a, 1c, 1d, and/or 2a, check the applicable box and enter the amount
    on line 1f. If you checked more than one box, enter the total on line 1f.


    **Line 1y. Other additions to tax.** Enter the following additions to tax.


    1. Recapture of the alternative fuel vehicle refueling property credit (see Form
    8911). Identify as "ARPCR."

    2. Any EPE related to the credit applied against tax from Form 8933 reported on
    Form 4255, line 2a, column (k). Identify as "EPE8933."

    3. Recapture of any non-EPE credit from Form 8933 reported on Form 4255, line
    2a, column (j). Also, any section 6418(g)(3) amounts attributable to recapture
    from Form 8933 reported on Form 4255, line 2a, column (m)(3). Identify as "NEPE8933."

    4. Any amount that was reported on Form 4255, column (n)(2), line 1a, 1c, 1d,
    and/or 2a. Identify as "EPGEPE."

    5. Any section 6418(g)(2) excessive credit transfer amount reported on Form 4255,
    column (m)(1) and (m)(2). Identify as "6418(g)(2)."


    111


    # Page 112

    **TIP** For more information about elective pay and credit transferability, go
    to IRS.gov/Credits-Deductions/Elective-Pay-and-Transferability-Frequently-Asked-Questions-Transferability.


    '
