- section_id: instruction_section_instructions_form_1040_2025_0058
  document_id: form_1040_2025
  line: '37'
  line_tokens:
  - '37'
  heading: Line 37
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: "## Line 37\n\n### Amount You Owe\n\nThe IRS offers several payment options.\
    \ Go to IRS.gov/ModernPayments to see your options.\n\n#### Pay Online\n\nPaying\
    \ online is convenient and secure and helps make sure we get your payments on\
    \ time. To pay your taxes online or for more information, go to IRS.gov/ModernPayments.\
    \ You can pay using any of the following methods.\n\n- **Your Online Account.**\
    \ You can make tax payments through your online account, including balance payments,\
    \ estimated tax payments, or other types. You can also see your payment history\
    \ and other tax records there. Go to IRS.gov/Account.\n\n- **IRS Direct Pay.**\
    \ For online transfers directly from your checking or savings account at no cost\
    \ to you, go to IRS.gov/Payments.\n\n- **Pay by Card or Digital Wallet.** To pay\
    \ by debit or credit card, or digital wallet, go to IRS.gov/Payments. A fee is\
    \ charged by these service providers. You can also pay by phone with a debit or\
    \ credit card. See *Debit or credit card under Pay by Phone*, later.\n\n- **Electronic\
    \ Funds Withdrawal (EFW)** is an integrated *e-file/e-pay* option offered when\
    \ filing your federal taxes electronically using tax return preparation software,\
    \ through a tax professional or the IRS at IRS.gov/Payments.\n\n- **Online Payment\
    \ Agreement.** If you can't pay in full by the due date of your tax return, you\
    \ can apply for an online monthly installment agreement at IRS.gov/OPA. Once you\
    \ complete the online process, you will receive immediate notification of whether\
    \ your agreement\n\nment has been approved. A user fee is charged.\n\n- **Electronic\
    \ Federal Tax Payment System (EFTPS).** Allows you to pay your taxes online or\
    \ by phone directly from your checking or savings account. There is no fee for\
    \ this service. You must be enrolled either online or have an enrollment form\
    \ mailed to you. See *EFTPS under Pay by Phone*, later.\n\n#### Pay by Phone\n\
    \nPaying by phone is another safe and secure method of paying electronically.\
    \ Use one of the following methods: (1) call one of the debit or credit card service\
    \ providers, or (2) use the Electronic Federal Tax Payment System (EFTPS) to pay\
    \ directly from your checking or savings account.\n\n**Debit or credit card.**\
    \ Call one of our service providers. Each charges a fee that varies by provider,\
    \ card type, and payment amount.\n\nLink2Gov Corporation  \n888-PAY-1040  \n(888-729-1040)\
    \  \nPAY1040.com\n\nACI Payments, Inc.  \n888-UPAY-TAX  \n(888-872-9829)  \nfed.acipayonline.com\n\
    \n**EFTPS.** To get more information about EFTPS or to enroll in EFTPS, visit\
    \ EFTPS.gov or call 800-555-4477. To contact EFTPS using Telecommunications Relay\
    \ Services (TRS) for people who are deaf, hard of hearing, or have a speech disability,\
    \ dial 711 and then provide the TRS assistant the 800-555-4477 number or 800-733-4829.\
    \ Additional information about EFTPS is also available in Pub. 966.\n\n#### Pay\
    \ by Mobile Device\n\nTo pay through your mobile device, download the IRS2Go app.\n\
    \n#### Pay by Cash\n\nYou can pay your taxes in cash. To find out about the different\
    \ cash payment methods, go to IRS.gov/PayCash. Don't send cash payments through\
    \ the mail.\n\n#### Pay by Check or Money Order\n\nBefore submitting a payment\
    \ through the mail, please consider alternative methods. One of our safe, quick,\
    \ and easy electronic payment options might be right for you. If you choose to\
    \ mail a tax payment, attach Form 1040-V. For the most up-to-date information\
    \ on Form 1040-V, go to IRS.gov/Form1040V.\n\n#### What if You Can't Pay?\n\n\
    If you can't pay the full amount shown on line 37 when you file, you can ask for:\n\
    \n- An installment agreement, or\n\n**Installment agreement.** Under an installment\
    \ agreement, you can pay all or part of the tax you owe in monthly installments.\
    \ However, even if an installment agreement is granted, you will be charged interest\
    \ and may be charged a late payment penalty on the tax not paid by the due date\
    \ of your return (not counting extensions)April 15, 2026, for most people. You\
    \ must also pay a fee. To limit the interest and penalty charges, pay as much\
    \ of the tax as possible when you file. But before requesting an installment agreement,\
    \ you should consider other less costly alternatives, such as a bank loan or credit\
    \ card payment.\n\nTo ask for an installment agreement, you can apply online or\
    \ use Form 9465. To apply online, go to IRS.gov/OPA.\n\n**Extension of time to\
    \ pay.** If paying the tax when it is due would cause you an undue hardship, you\
    \ can ask for an extension of time to pay by filing Form 1127 by the due date\
    \ of your return (not counting extensions)April 15, 2026, for most people. An\
    \ extension generally won't be granted for more than 6 months. You will be charged\
    \ interest on the tax not paid by April 15, 2026. You must pay the tax before\
    \ the extension runs out. If you do not pay the tax by the extended due date,\
    \ penalties and interest will be imposed until taxes are paid in full. For the\
    \ most up-to-date information on Form 1127, go to IRS.gov/Form1127.\n\n64\n\n\
    Need more information or forms? Visit IRS.gov.\n\n# Page 65\n"
