  line_tokens:
  - '6'
  heading: Line 6
  context_heading: Instructions for Schedule 2
  text: '## Line 6


    ### Uncollected Social Security and Medicare Tax From Form 8919


    Enter the total of any taxes from Form 8919.


    If you are an employee who received wages from an employer who didn''t withhold
    social security and Medicare tax from your wages, use Form 8919 to figure your
    share of the unreported tax. Include on line 6 the amount from line 13 of Form
    8919. Include the


    amount from line 6 of Form 8919 on Form 1040 or 1040-SR, line 1g.


    '
