- section_id: instruction_section_instructions_form_1040_2025_0015
  document_id: form_1040_2025
  line: 2b
  line_tokens:
  - 2b
  heading: Line 2b
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 2b


    ### Taxable Interest


    Each payer should send you a Form 1099-INT or Form 1099-OID. Enter your total
    taxable interest income on line 2b. But you must fill in and attach Schedule B
    if the total is over $1,500 or any of the other conditions listed at the beginning
    of the Schedule B instructions applies to you.


    For more details about reporting taxable interest, including original issue discount
    or market discount on debt instruments and adjustments for amortizable bond premium
    or acquisition premium, see Pub. 550.


    Interest credited in 2025 on deposits that you couldn''t withdraw because of the
    bankruptcy or insolvency of the financial institution may not have to be included
    in your 2025 income. For details, see Pub. 550.


    If you get a 2025 Form 1099-INT for U.S. savings bond interest that includes amounts
    you reported before 2025, see Pub. 550.


    '
