  text: '#### Lines 1a Through 1z


    ##### Additions to Tax


    **Line 1a. Excess advance premium tax credit repayment.** The premium tax credit
    helps pay premiums for health insurance purchased from the Marketplace. Eligible
    individuals may have advance payments of the premium tax credit paid on their
    behalf directly to the insurance company. If you, your spouse with whom you are
    filing a joint return, or your dependent was enrolled in coverage purchased from
    the Marketplace and advance payments of the premium tax credit were made for the
    coverage, complete Form 8962 to reconcile (compare) the advance payments with
    your premium tax credit. You (or whoever enrolled you) should have received Form
