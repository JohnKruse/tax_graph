  text: '## Line 1e


    ### Taxable Dependent Care Benefits From Form 2441, Line 26


    Enter the total of your taxable dependent care benefits from Form 2441, line 26.
    Dependent care benefits should be shown in box 10 of your Form(s) W-2. But first
    complete Form 2441 to see if you can exclude part or all of the benefits.


    '
