  text: "## Lines 5a, 5b, and 5c\n\n### Lines 5a and 5b Pensions and Annuities\n\n\
    You should receive a Form 1099-R showing the total amount of your pension and\
    \ annuity payments before income tax or other deductions were withheld. This amount\
    \ should be shown in box 1 of Form 1099-R. Pension and annuity payments include\
    \ distributions from 401(k), 403(b), and governmental 457(b) plans. Rollovers\
    \ and lump-sum distributions are explained later. Dont include the following payments\
    \ on lines 5a and 5b. Instead, report them on line 1h.\n\n- Disability pensions\
    \ received before you reach the minimum retirement age set by your employer.\n\
    - Corrective distributions (including any earnings) of excess elective deferrals\
    \ or other excess contributions to retirement plans. The plan must advise you\
    \ of the year(s) the distributions are includable in income.\n\nAttach Form(s)\
    \ 1099-R to Form 1040 or 1040-SR if any federal income tax was withheld.\n\n###\
    \ Fully Taxable Pensions and Annuities\n\nYour payments are fully taxable if (a)\
    \ you didnt contribute to the cost (see *Cost*, later) of your pension or annuity,\
    \ or (b) you got your entire cost back tax free before 2025. But see *Insurance\
    \ Premiums for Retired Public Safety Officers*, later. If your pension or annuity\
    \ is fully taxable, enter the total pension or annuity payments (from Form(s)\
    \ 1099-R, box 1) on line 5b; dont make an entry on line 5a.\n\nFully taxable pensions\
    \ and annuities also include military retirement pay shown on Form 1099-R. For\
    \ details on military disability pensions, see Pub. 525. If you received a Form\
    \ RRB-1099-R, see Pub. 575 to find out how to report your benefits.\n\n### Partially\
    \ Taxable Pensions and Annuities\n\nEnter the total pension or annuity payments\
    \ (from Form 1099-R, box 1) on line 5a. If your Form 1099-R doesnt show the taxable\
    \ amount, you must use the General Rule explained in Pub. 939 to figure the taxable\
    \ part to enter on line 5b. But if your annuity starting date (defined later)\
    \ was after July 1, 1986, see *Simplified Method*, later, to find out if you must\
    \ use that method to figure the taxable part.\n\nYou can ask the IRS to figure\
    \ the taxable part for you for a $1,000 fee. For details, see Pub. 939.\n\nIf\
    \ your Form 1099-R shows a taxable amount, you can report that amount on line\
    \ 5b. But you may be able to report a lower taxable amount by using the General\
    \ Rule or the Simplified Method or if the exclusion for retired public safety\
    \ officers, discussed next, applies.\n\n### Insurance Premiums for Retired Public\
    \ Safety Officers\n\nIf you are an eligible retired public safety officer (law\
    \ enforcement officer, firefighter, chaplain, or member of a rescue squad or ambulance\
    \ crew who is retired because of disability or because you reached normal retirement\
    \ age), you can elect to exclude from income distributions made from your eligible\
    \ retirement plan that are used to pay the premiums\n\nfor coverage by an accident\
    \ or health plan or a long-term care insurance contract. The premiums can be for\
    \ coverage for you, your spouse, or dependents. The distribution must be from\
    \ the plan maintained by the employer from which you retired as a public safety\
    \ officer. The distribution can be made directly from the plan to the provider\
    \ of the accident or health plan or long-term care insurance contract, or the\
    \ distribution can be made to you to pay to the provider of the accident or health\
    \ plan or long-term care insurance contract. You can exclude from income the smaller\
    \ of the amount of the premiums paid or $3,000. You can make this election only\
    \ for amounts that would otherwise be included in your income. The amount excluded\
    \ from your income cant be used to claim a medical expense deduction.\n\nAn eligible\
    \ retirement plan is a governmental plan that is a qualified trust or a section\
    \ 403(a), 403(b), or 457(b) plan.\n\nYou can exclude from income only the smaller\
    \ of the amount of the premiums paid or $3,000. This is true if the distribution\
    \ was made directly from the plan to the provider of the accident or health plan\
    \ or long-term care insurance contract or if the distribution was made to you\
    \ and you paid the provider of the accident or health plan or long-term care insurance\
    \ contract. If you received a distribution from your eligible retirement plan,\
    \ and you used part of that distribution to pay premiums for an accident or health\
    \ plan or long-term care insurance contract, you can still exclude from income\
    \ only the smaller of the amount of the premiums paid or $3,000. The rest of the\
    \ distribution is taxable to you and must be reported on line 5b.\n\nIf you make\
    \ this election, reduce the otherwise taxable amount of your pension or annuity\
    \ by the amount excluded. The amount shown in box 2a of Form 1099-R doesnt reflect\
    \ the exclusion. Report your total distributions on line 5a and the taxable amount\
    \ on line 5b. Also check box 2 on line 5c.\n\nIf you are retired on disability\
    \ and reporting your disability pension on line 1h, include only the taxable amount\
    \ on that line and enter PSO and the\n\n28\n\nNeed more information or forms?\
    \ Visit IRS.gov.\n\n# Page 29\nSimplified Method WorksheetLines 5a and 5b\n\n\
    Keep for Your Records\n\n**Before you begin:**  If you are the beneficiary of\
    \ a deceased employee or former employee who died **before** August 21, 1996,\
    \ include any death benefit exclusion that you are entitled to (up to \\$5,000)\
    \ in the amount entered on line 2 below.\n\n**More than one pension or annuity.**\
    \ If you had more than one partially taxable pension or annuity, figure the taxable\
    \ part of each separately. Enter the total of the taxable parts on Form 1040 or\
    \ 1040-SR, line 5b. Enter the total pension or annuity payments received in 2025\
    \ on Form 1040 or 1040-SR, line 5a.\n\n1. Enter the total pension or annuity payments\
    \ from Form 1099-R, box 1. Also, enter this amount on Form 1040 or 1040-SR, line\
    \ 5a . . . . . 1. \\_\\_\\_\\_\\_\n2. Enter your cost in the plan at the annuity\
    \ starting date . . . . . 2. \\_\\_\\_\\_\\_\n**Note.** If you completed this\
    \ worksheet last year, skip line 3 and enter the amount from line 4 of last year's\
    \ worksheet on line 4 below (even if the amount of your pension or annuity has\
    \ changed). Otherwise, go to line 3.\n3. Enter the appropriate number from **Table\
    \ 1** below. **But** if your annuity starting date was **after** 1997 and the\
    \ payments are for your life and that of your beneficiary, enter the appropriate\
    \ number from **Table 2** below . . . . . 3. \\_\\_\\_\\_\\_\n4. Divide line 2\
    \ by the number on line 3 . . . . . 4. \\_\\_\\_\\_\\_\n5. Multiply line 4 by\
    \ the number of months for which this year's payments were made. If your annuity\
    \ starting date was **before** 1987, skip lines 6 and 7 and enter this amount\
    \ on line 8. Otherwise, go to line 6 . . . . . 5. \\_\\_\\_\\_\\_\n6. Enter the\
    \ amount, if any, recovered tax free in years after 1986. If you completed this\
    \ worksheet last year, enter the amount from line 10 of last year's worksheet\
    \ . . . . . 6. \\_\\_\\_\\_\\_\n7. Subtract line 6 from line 2 . . . . . 7. \\\
    _\\_\\_\\_\\_\n8. Enter the **smaller** of line 5 or line 7 . . . . . 8. \\_\\\
    _\\_\\_\\_\n9. **Taxable amount.** Subtract line 8 from line 1. Enter the result,\
    \ but not less than zero. Also, enter this amount on Form 1040 or 1040-SR, line\
    \ 5b. If your Form 1099-R shows a larger amount, use the amount on this line instead\
    \ of the amount from Form 1099-R. If you are a retired public safety officer,\
    \ see *Insurance Premiums for Retired Public Safety Officers* before entering\
    \ an amount on line 5b . . . . . 9. \\_\\_\\_\\_\\_\n10. Was your annuity starting\
    \ date before 1987?  \n  Yes. ![STOP]() Do not complete the rest of this worksheet.\
    \  \n  No. Add lines 6 and 8. This is the **amount you have recovered tax free**\
    \ through 2025. You will need this number if you need to fill out this worksheet\
    \ next year . . . . . 10. \\_\\_\\_\\_\\_\n11. **Balance of cost to be recovered.**\
    \ Subtract line 10 from line 2. If zero, you won't have to complete this worksheet\
    \ next year. The payments you receive next year will generally be fully taxable\
    \ . . . . . 11. \\_\\_\\_\\_\\_\n\n**Table 1 for Line 3 Above**\n\n|  IF the age\
    \ at annuity starting date was... | AND your annuity starting date was  |   |\n\
    | --- | --- | --- |\n|   |  before November 19, 1996, enter on line 3... | after\
    \ November 18, 1996, enter on line 3...  |\n|  55 or under | 300 | 360  |\n| \
    \ 5660 | 260 | 310  |\n|  6165 | 240 | 260  |\n|  6670 | 170 | 210  |\n|  71 or\
    \ older | 120 | 160  |\n\n**Table 2 for Line 3 Above**\n\n|  IF the combined ages\
    \ at annuity starting date were... | THEN enter on line 3...  |\n| --- | --- |\n\
    |  110 or under | 410  |\n|  111120 | 360  |\n|  121130 | 310  |\n|  131140 |\
    \ 260  |\n|  141 or older | 210  |\n\nNeed more information or forms? Visit IRS.gov.\n\
    \n29\n\n# Page 30\namount excluded on the line next to line 1h.\n\n**Payments\
    \ when you are disabled.** If you receive payments from a retirement or profit-sharing\
    \ plan that does not provide for disability retirement, do not treat those payments\
    \ as disability payments. The payments must be reported as a pension or annuity.\n\
    \nYou must include in your income any amounts that you received that you would\
    \ have received in retirement had you not become disabled as a result of a terrorist\
    \ attack. Include in your income any payments you receive from a 401(k), pension,\
    \ or other retirement plan to the extent that you would have received the amount\
    \ at the same or later time regardless of whether you had become disabled.\n\n\
    **Example.** You were a contractor who was disabled as a direct result of participating\
    \ in efforts to clean up the World Trade Center and you are eligible for compensation\
    \ by the September 11 Victim Compensation Fund. You began receiving a disability\
    \ pension at age 55 when you could no longer work due to your disability. Under\
    \ your pension plan, you are entitled to an early retirement benefit of $2,500\
    \ a month at age 55. If you wait until age 62, the normal retirement age under\
    \ the plan, you would be entitled to a normal retirement benefit of $3,000 a month.\
    \ The pension plan provides that a participant who retires early on account of\
    \ disability is entitled to receive the participant's normal retirement benefit,\
    \ which in your case equals $3,000 a month. Until you turn age 62, you can exclude\
    \ $500 of your monthly retirement benefit from income (the difference between\
    \ the early retirement benefit and the normal retirement benefit, $3,000  $2,500)\
    \ received on account of disability. You must report the remaining $2,500 of monthly\
    \ pension benefit as taxable. For each month after you turn age 62, you must report\
    \ the full amount of the monthly pension benefit ($3,000 a month) as taxable.\n\
    \n"
