- section_id: instruction_section_instructions_form_1040_2025_0053
  document_id: form_1040_2025
  line: 35a
  line_tokens:
  - 35a
  - 35b
  - 35c
  - 35d
  heading: Lines 35a Through 35d
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Lines 35a Through 35d


    ### Amount Refunded to You


    If you want to check the status of your refund, just use the IRS2Go app or go
    to IRS.gov/Refunds. See Refund Information, later. Information about your refund
    will generally be available within 24 hours after the IRS receives your e-filed
    return, or 4 weeks after you mail your paper return. If you filed Form 8379 with
    your return, wait 14 weeks (11 weeks if you filed electronically). Have your 2025
    tax return handy so you can enter your social security number, your filing status,
    and the exact whole dollar amount of your refund.


    Where''s My Refund will provide a personalized refund date as soon as the IRS
    processes your tax return and approves your refund.


    Claiming a refund for a deceased taxpayer. If you are filing a joint return with
    your deceased spouse, you only need to file the tax return to claim the refund.
    If you are a court-appointed representative, file the return and include a copy
    of the certificate that shows your appointment. All other filers requesting the
    deceased taxpayer''s refund must file the return and attach Form 1310.


    Effect of refund on benefits. Any refund you receive can''t be counted as income
    when determining if you or anyone else is eligible for benefits or assistance,
    or how much you or anyone else can receive, under any federal program or under
    any state or local program financed in whole or in part with federal funds. These
    programs include Temporary Assistance for Needy Families (TANF), Medicaid, Supplemental
    Security Income (SSI), and Supplemental Nu-


    trition Assistance Program (formerly food stamps). In addition, when determining
    eligibility, the refund can''t be counted as a resource for at least 12 months
    after you receive it. Check with your local benefit coordinator to find out if
    your refund will affect your benefits.


    '
