  heading: Line 4
  context_heading: Instructions for Schedule 3
  text: '#### Line 4


    ##### Retirement Savings Contributions Credit (Saver''s Credit)


    You may be able to take this credit if you, or your spouse if filing jointly,
    made (a) contributions, other than roll-over contributions, to a traditional or
    Roth IRA; (b) elective deferrals to a 401(k) or 403(b) plan (including designated
    Roth contributions) or to a governmental section 457(b) plan, SIMPLE IRA, or a
    SEP; (c) voluntary employee contributions to a qualified retirement plan (including
    the federal Thrift Savings Plan); (d) contributions to a 501(c)(18)(D) plan; or
    (e) contributions to an ABLE account by the designated beneficiary, as defined
    in section 529A.


    However, you can''t take the credit if either of the following applies.


    115


    # Page 116

    1. The amount on Form 1040, 1040-SR, or 1040-NR, line 11b, is more than $39,500
    ($59,250 if head of household; $79,000 if married filing jointly).


    2. The person(s) who made the qualified contribution or elective deferral (a)
    was born after January 1, 2008, (b) is claimed as a dependent on someone else''s
    2025 tax return, or (c) was a student (defined next).


    You were a student if during any part of 5 calendar months of 2025, you:


    -  Were enrolled as a full-time student at a school; or

    -  Took a full-time, on-farm training course given by a school or a state, county,
    or local government agency.


    A school includes a technical, trade, or mechanical school. It doesn''t include
    an on-the-job training course, correspondence school, or school offering courses
    only through the Internet.


    For more details, use Tax Topic 610 or see Form 8880.


    '
