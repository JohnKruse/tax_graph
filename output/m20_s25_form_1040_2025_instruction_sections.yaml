    Part II.** If you purchased a new clean vehicle from a registered dealer and reduced
    the amount you paid at the time of sale by transferring the credit to the dealer,
    you may have to repay the amount of the credit you transferred if you no longer
    qualify. If you completed Schedule A (Form 8936), Part II, and you:


    -  Checked the "Yes" box on Part II, line 8a or 8d; and

    -  Checked the "Yes" box on Part I, line 4a; then,

    enter the amount from Part I, line 4a, on Schedule 2, line 1b.


    If you completed more than one Schedule A (Form 8936), Part II, and you need to
    report an amount from more than one Schedule A (Form 8936), Part II, enter the
    total of those amounts on line 1b.


