- section_id: instruction_section_instructions_form_1040_2025_0057
  document_id: form_1040_2025
  line: '36'
  line_tokens:
  - '36'
  heading: Line 36
  context_heading: Line Instructions for Forms 1040 and 1040-SR
  text: '## Line 36


    ### Applied to Your 2026 Estimated Tax


    Enter on line 36 the amount, if any, of the overpayment on line 34 you want applied
    to your 2026 estimated tax. We will apply this amount to your account unless you
    include a statement requesting us to apply it to your spouse''s account. Include
    your spouse''s social security number in the statement.


    **CRUTION** *This election to apply part or all of the amount overpaid to your
    2026 estimated tax can''t be changed later.*


    '
