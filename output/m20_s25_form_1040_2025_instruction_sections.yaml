    If you got an automatic extension of time to file Form 1040, 1040-SR, or 1040-NR
    by filing Form 4868 or by making a payment, enter the amount of the payment or
    any amount you paid with Form 4868. If you paid a fee when making your payment,
    don''t include on line 10 the fee you were charged. Also, include any amounts
    paid with Form 2350.


    '
