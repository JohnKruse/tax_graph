  text: '# **State and Local Income Tax Refund WorksheetSchedule 1, Line 1**


    **Before you begin:**  Be sure you have read the *Exception* in the instructions
    for this line to see if you can use this worksheet instead of Pub. 525 to figure
    if any of your refund is taxable.


    1. Enter the income tax refund from **Form(s) 1099-G** (or similar statement).
    But **don''t** enter more than the amount of your state and local income taxes
    shown on your 2024 Schedule A, line 5d ... 1. \_\_\_\_\_


    2. Is the amount of state and local income taxes (or general sales taxes), real
    estate taxes, and personal property taxes paid in 2024 (generally, this is the
    amount reported on your 2024 Schedule A, line 5d) more than the amount on your
    2024 Schedule A, line 5e?


    No. Enter the amount from line 1 on line 3 and go to line 4.


    Yes. Subtract the amount on your 2024 Schedule A, line 5e, from the amount of
    state and local income taxes (or general sales taxes), real estate taxes, and
    personal property taxes paid in 2024 (generally, this is the amount reported on
    your 2024 Schedule A, line 5d).


    2. \_\_\_\_\_


    3. Is the amount on line 1 more than the amount on line 2?


    No. **STOP** None of your refund is taxable.


    Yes. Subtract line 2 from line 1.


    3. \_\_\_\_\_


    4. Enter your total itemized deductions from your 2024 Schedule A, line 17.


    4. \_\_\_\_\_


    **Note.** If the filing status on your 2024 Form 1040 or 1040-SR was married filing
    separately and your spouse itemized deductions in 2024, skip lines 5 through 7,
    enter the amount from line 4 on line 8, and go to line 9.


    5. Enter the amount shown below for the filing status claimed on your **2024**
    Form 1040 or 1040-SR.


    -  Single or married filing separately\$14,600

    -  Married filing jointly or qualifying surviving spouse\$29,200

    -  Head of household\$21,900


    5. \_\_\_\_\_


    6. Check any boxes that apply.\*


    You were born before January 2, 1960.


    You are blind.


    Spouse was born before January 2, 1960.


    Spouse is blind.


    No boxes checked. Enter -0-.


    Multiply the number of boxes checked by \$1,550 (\$1,950 if your 2024 filing status
    was single or head of household).


    6. \_\_\_\_\_


    \*If your filing status is married filing separately, you can check the boxes
    for your spouse only if your spouse had no income, isn''t filing a return, and
    can''t be claimed as a dependent on another person''s return.


    7. Add lines 5 and 6 ... 7. \_\_\_\_\_


    8. Is the amount on line 7 less than the amount on line 4?


    No. **STOP** None of your refund is taxable.


    Yes. Subtract line 7 from line 4 ... 8. \_\_\_\_\_


    9. **Taxable part of your refund.** Enter the **smaller** of line 3 or line 8
    here and on Schedule 1, line 1 ... 9. \_\_\_\_\_


    90


    # Page 91

    sporadic activity). Instead, see the Instructions for Recipient included on Form
    1099-MISC, or 1099-NEC, to find out where to report that income. For more information
    about what is being reported on Form 1099-K, see the Instructions for Payee included
    on that form and visit IRS.gov/1099K.


    #### Line 8a


    **Net operating loss (NOL) deduction.** Enter any deduction for an NOL from an
    earlier year. Enter the amount in the pre-printed parentheses (as a negative number).
    The amount of your deduction will be subtracted from the other amounts of income
    listed on lines 8b through 8z. See the Instructions for Form 172 for details.


    #### Line 8b


    **Gambling.** Enter gambling winnings not attributable to a trade or business.
    Gambling winnings include lotteries, raffles, a lump-sum payment from the sale
    of a right to receive future lottery payments, etc. For details on gambling losses,
    see the instructions for Schedule A, line 16.


    Attach Form(s) W-2G to Form 1040 or 1040-SR if any federal income tax was withheld.


    #### Line 8c


    **Cancellation of debt.** Enter any canceled debt. Canceled debt may be shown
    in box 2 of Form 1099-C. However, part or all of your income from cancellation
    of debt may be nontaxable. See Pub. 4681 or go to IRS.gov and enter canceled debt
    or foreclosure in the search box.


    #### Line 8d


    **Foreign earned income exclusion and housing exclusion from Form 2555.** Enter
    the amount of your foreign earned income and housing exclusion from Form 2555,
    line 45. Enter the amount in the pre-printed parentheses (as a negative number).
    The amount from Form 2555, line 45, will be subtracted from the other amounts
    of income listed on lines 8a through 8c and lines 8e through 8z.


    Complete the Foreign Earned Income Tax Worksheet if you enter an amount on Form
    2555, line 45.


    #### Line 8e


    **Income from Form 8853.** Enter the total of the amounts from Form 8853, lines
    8, 12, and 26. See Pub. 969.


    You may have to pay an additional tax if you received a taxable distribution from
    an Archer MSA or Medicare Advantage MSA. See the Instructions for Form 8853.


    #### Line 8f


    **Income from Form 8889.** Enter the total of the amounts from Form 8889, lines
    16 and 20.


    You may have to pay an additional tax if you received a taxable distribution from
    a health savings account. See the Instructions for Form 8889.


    #### Line 8h


    **Jury duty pay.** Enter any jury duty pay and see the instructions for line 24a.


    #### Line 8i


    **Prizes and awards.** Enter prizes and awards but see the instructions for line
    8m, Olympic and Paralympic medals and USOC prize money, later.


    #### Line 8j


    **Activity not engaged in for profit income.** See Pub. 525.


    #### Line 8k


    **Stock options.** Enter any income from the exercise of stock options not otherwise
    reported on Form 1040 or 1040-SR, line 1h.


    #### Line 8l


    **Income from the rental of personal property if you engaged in the rental for
    profit but were not in the business of renting such property.** Also see the instructions
    for line 24b, later.


    #### Line 8m


    **Olympic and Paralympic medals and USOC prize money.** The value of Olympic and
    Paralympic medals and the amount of United States Olympic Committee (USOC) prize
    money you receive on account of your participation in the Olympic or Paralympic
    Games may be nontaxable. These amounts should be reported to you in box 3 of Form
    1099-MISC. To see if these amounts are nontaxable, first figure your adjusted
    gross income, including the amount of your medals and prize money.


    If your adjusted gross income is not more than $1,000,000 ($500,000 if married
    filing separately), these amounts are nontaxable and you should include the amount
    in box 3 of Form 1099-MISC on line 8m, then subtract it by including it on line
    24c.


    #### Line 8n


    **Section 951(a) inclusion.** Section 951 generally requires that a U.S. shareholder
    of a controlled foreign corporation include in income its pro rata share of the
    corporations subpart F income and its amount determined under section 956. Enter
    on line 8n the sum of any amounts reported on lines 1a through 1h and line 2 of
    your Forms 5471, Schedule(s) I.


    #### Line 8o


    **Section 951A(a) inclusion.** Section 951A generally requires that a U.S. shareholder
    of a controlled foreign corporation include in income its global intangible low-taxed
    income (GILTI). Enter on line 8o from your Forms 8992 the sum of any amounts reported
    on Part II, line 5. Remember to attach copies of your Forms 8992.


    If you made a section 962 election and have an income inclusion under section
    951 or 951A, do not report that income on line 8n or 8o, as applicable. Instead,
    report the tax with respect to the section 962 election on Form 1040 or 1040-SR,
    line 16, and attach a statement showing how you figured the tax that includes
    the gross amounts of section 951 and section 951A income.


    91


    # Page 92

    ## Line 8p


    **461(l) excess business loss adjustment.** Enter the amount of your excess business
    loss from Form 461, line 16.


    ## Line 8q


    **Taxable distributions from an ABLE account.** Distributions from this type of
    account may be taxable if (a) they are more than the designated beneficiary''s
    qualified disability expenses, and (b) they were not included in a qualified rollover.
    See Pub. 907 for more information.


    *You may have to pay an additional tax if you received a taxable distribution
    from an ABLE account. See the Instructions for Form 5329.*


    ## Line 8r


    **Scholarship and fellowship grants not reported on Form W-2.** Enter the amount
    of scholarship and fellowship grants not reported on Form W-2. However, if you
    were a degree candidate, include on line 8r only the amounts you used for expenses
    other than tuition and course-related expenses. For example, amounts used for
    room, board, and travel must be reported on line 8r.


    ## Line 8s


    **Nontaxable amount of Medicaid waiver payments included on Form 1040, line 1a
    or 1d.** Certain Medicaid waiver payments you received for caring for someone
    living in your home with you may be nontaxable. Your nontaxable Medicaid waiver
    payments should be reported to you on Form(s) W-2 in box 12, Code II. If nontaxable
    payments were reported to you in box 1 of Form(s) W-2, report the amount on Form
    1040 or 1040-SR, line 1a. If you did not receive a Form W-2 for nontaxable payments,
    or you received nontaxable payments that you didn''t report on line 1a, and choose
    to include nontaxable amounts in earned income for purposes of claiming a credit
    or other tax benefit, report the amount on Form 1040 or 1040-SR, line 1d. Then,
    on line 8s, enter the total amount of the nontaxable payments reported on Form
    1040 or 1040-SR, line 1a or 1d, in


    the entry space in the preprinted parentheses (as a negative number). For more
    information about these payments, see Pub. 525.


    If you do not have a separate trade or business of providing these services, enter
    any nontaxable Medicaid waiver payments on Schedule 1, line 8s. Also, enter your
    Medicaid waiver payments reported on Form 1099-MISC or Form 1099-NEC on Form 1040,
    line 1d.


    ## Line 8t


    **Pension or annuity from a nonqualified deferred compensation plan or a nongovernmental
    section 457 plan.** Enter the amount that you received as a pension or annuity
    from a nonqualified deferred compensation plan or a nongovernmental 457 plan.
    This may be shown in box 11 of Form W-2. If you received such an amount but box
    11 is blank, contact your employer or the payer for the amount received.


    ## Line 8u


    **Wages earned while incarcerated.** Enter the amount that you received for services
    performed while an inmate in a penal institution. You may receive Form(s) W-2
    or Form(s) 1099.


    ## Line 8v


    **Digital assets not reported elsewhere.** If, in 2025, you received ordinary
    income in connection with digital assets that isn''t reported elsewhere on your
    return (for example, digital assets, such as income from forks, staking, or mining,
    which aren''t wages reported on line 1a or capital gain or loss reported on Form
    8949 and Schedule D), report this income on line 8v. Don''t report a gift or inheritance
    of digital assets on line 8v. For more information, go to IRS.gov/Digital-Assets


    If you used a broker to effect the sale of a digital asset, your broker should
    send you Form 1099-DA. You must answer the digital asset question on Form 1040
    whether or not you received a Form 1099-DA.


    ## Line 8z


    **Other income.** Use line 8z to report any taxable income not reported else-


    where on your return or other schedules. List the type and amount of income. If
    necessary, include a statement showing the required information. For more details,
    see *Miscellaneous Income* in Pub. 525.


    Examples of income to report on line 8z include the following.


    - Reimbursements or other amounts received for items deducted in an earlier year,
    such as medical expenses, real estate taxes, general sales taxes, or home mortgage
    interest. See *Recoveries* in Pub. 525 for details on how to figure the amount
    to report.


    - Reemployment trade adjustment assistance (RTAA) payments. These payments should
    be shown in box 5 of Form 1099-G.


    - Loss on certain corrective distributions of excess deferrals. See *Retirement
    Plan Contributions* in Pub. 525.


    - Dividends on insurance policies if they exceed the total of all net premiums
    you paid for the contract.


    - Recapture of a charitable contribution deduction relating to the contribution
    of a fractional interest in tangible personal property. See *Fractional Interest
    in Tangible Personal Property* in Pub. 526. Interest and an additional 10% tax
    apply to the amount of the recapture. See the instructions for Schedule 2, line
    17g.


    - Recapture of a charitable contribution deduction if the charitable organization
    disposes of the donated property within 3 years of the contribution. See *Recapture
    if no exempt use* in Pub. 526.


    - Taxable part of disaster relief payments. See Pub. 525 to figure the taxable
    part, if any. If any of your disaster relief payment is taxable, attach a statement
    showing the total payment received and how you figured the taxable part.


    - Taxable distributions from a Coverdell education savings account (ESA) or a
    qualified tuition program (QTP). Distributions from these accounts may be taxable
    if (a) in the case of distributions from a QTP, they are more than the qualified
    higher education expenses of the designated beneficiary in 2025 or, in the case
    of distributions from an ESA, they are more than the qualified education expenses
    of the designated beneficiary in 2025; and (b) they were not included in a qualified
    rollover. Nontaxa-


    92


    # Page 93

    ble distributions from these accounts don''t have to be reported on Form 1040
    or 1040-SR. This includes rollovers and qualified higher education expenses refunded
    to a student from a QTP that were recontributed to a QTP with the same designated
    beneficiary generally within 60 days after the date of refund. See Pub. 970.


    You may have to pay an additional tax if you received a taxable distribution from
    a Coverdell ESA or a QTP. See the Instructions for Form 5329.


    **Nontaxable income.** Don''t report any nontaxable income on line 8z. Examples
    of nontaxable income include the following.


    - Child support.

    - Life insurance proceeds received because of someone''s death (with some exceptions;
    any taxable amounts will generally be reported to you on Form 1099-R).


    - Gifts and bequests. You may have to report information on your gifts or bequests
    on Form 3520, Part IV, if you received:


    1. A gift or bequest from a foreign individual or foreign estate (including foreign
    persons related to that foreign individual or foreign estate) totaling more than
    $100,000; or


    2. Amounts totaling more than $20,116 from a foreign corporation or foreign partnership
    (including foreign persons related to such foreign corporations or foreign partnerships)
    that you treated as gifts.


    See the Instructions for Form 3520.


    ## Adjustments to Income


    ### Line 11


    #### Educator Expenses


    If you were an eligible educator in 2025, you can deduct on line 11 up to $300
    of qualified expenses you paid in 2025. If you and your spouse are filing jointly
    and both of you were eligible educators, the maximum deduction is $600. However,
    neither spouse can de-


    duct more than $300 of their qualified expenses on line 11. An eligible educator
    is a kindergarten through grade 12 teacher, instructor, counselor, principal,
    or aide who worked in a school for at least 900 hours during a school year.


    Qualified expenses include ordinary and necessary expenses paid:


    - For professional development courses you have taken related to the curriculum
    you teach or to the students you teach; or

    - In connection with books, supplies, equipment (including computer equipment,
    software, and services), and other materials used in the classroom.


    An ordinary expense is one that is common and accepted in your educational field.
    A necessary expense is one that is helpful and appropriate for your profession
    as an educator. An expense doesn''t have to be required to be considered necessary.


    Qualified expenses include amounts paid or incurred in 2025 for personal protective
    equipment, disinfectant, and other supplies used for the prevention of the spread
    of coronavirus.


    Qualified expenses don''t include expenses for home schooling or for non-athletic
    supplies for courses in health or physical education.


    You must reduce your qualified expenses by the following amounts.


    - Excludable U.S. series EE and I savings bond interest from Form 8815.

    - Nontaxable qualified tuition program earnings or distributions.

    - Any nontaxable distribution of Coverdell education savings account earnings.

    - Any reimbursements you received for these expenses that weren''t reported to
    you in box 1 of your Form W-2.


    For more details, use Tax Topic 458 or see Pub. 529.


    ### Line 12


    #### Certain Business Expenses of Reservists, Performing Artists, and Fee-Basis
    Government Officials


    Include the following deductions on


    line 12.


    - Certain business expenses of National Guard and reserve members who traveled
    more than 100 miles from home to perform services as a National Guard or reserve
    member.

    - Performing-arts-related expenses as a qualified performing artist.

    - Business expenses of fee-basis state or local government officials.


    For more details, see Form 2106.


    ### Line 13


    #### Health Savings Account (HSA) Deduction


    You may be able to take this deduction if contributions (other than employer contributions,
    rollovers, and qualified HSA funding distributions from an IRA) were made to your
    HSA for 2025. See Form 8889.


    ### Line 14


    #### Moving Expenses


    You can deduct moving expenses if you are a member of the Armed Forces on active
    duty and due to a military order you move because of a permanent change of station.
    Use Tax Topic 455 or see Form 3903.


    If you are claiming only storage fees during your absence from the United States,
    check the box on line 14. For more information, see the Instructions for Form
    3903.


    ### Line 15


    #### Deductible Part of Self-Employment Tax


    If you were self-employed and owe self-employment tax, fill in Schedule SE to
    figure the amount of your deduction. The deductible part of your self-employment
    tax is on line 13 of Schedule SE.


    ### Line 16


    #### Self-Employed SEP, SIMPLE, and Qualified Plans


    If you were self-employed or a partner, you may be able to take this deduc-


    93


    # Page 94

    ## Self-Employed Health Insurance Deduction WorksheetSchedule 1, Line 17


    **Before you begin:**  Be sure you have read the **Exceptions** in the instructions
    for this line to see if you can use this worksheet instead of Form 7206 to figure
    your deduction.


    |  1. Enter the total amount paid in 2025 for health insurance coverage established
