name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Validate and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Check ASCII-only authored files
        run: uv run python tools/check_ascii.py

      - name: Validate graph
        run: uv run tax-graph validate 2025

      - name: Run capital-gains example
        run: uv run tax-graph run --facts examples/capital_gains_basic/facts.yaml

      - name: Run tests
        run: uv run pytest
